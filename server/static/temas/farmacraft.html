<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>FarmaCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="core.js"></script>
<style>
:root{--mc-font:"VT323",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font:20px/1.15 var(--mc-font);image-rendering:pixelated}
button,input,select{font:inherit}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.sh{text-shadow:2px 2px 0 #3f3f3f}

.dirt{background-color:#3b2a1d;background-size:64px 64px;image-rendering:pixelated}
#loading{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#loading .lt{font-size:28px}
#loading .lbar{width:min(420px,80vw);height:6px;background:#808080;border:0}
#loading .lbar i{display:block;height:100%;width:0;background:#80ff20;transition:width .2s}
#loading .ls{color:#c0c0c0}

#title{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
#title.out{opacity:0;pointer-events:none}
#title::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35));pointer-events:none}
.logo{position:relative;margin-top:-12vh;text-align:center;animation:logoIn 1.4s cubic-bezier(.2,1.4,.4,1) both}
.logo h1{margin:0;font:700 clamp(46px,9.5vw,118px)/1 Silkscreen,monospace;letter-spacing:.02em;color:transparent;background-size:48px 48px;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #2a2a2a) drop-shadow(0 4px 0 #1d1d1d) drop-shadow(0 3px 0 #111) drop-shadow(0 0 18px rgba(0,0,0,.5))}
.logo .ed{font:400 clamp(14px,2vw,22px) Silkscreen,monospace;color:#e8e8e8;letter-spacing:.35em;margin-top:10px;text-shadow:2px 2px 0 #3f3f3f}
.splash{position:absolute;right:-6%;bottom:-8px;color:#ffff00;font-size:clamp(18px,2.4vw,28px);text-shadow:2px 2px 0 #3f3f00;transform:rotate(-18deg);transform-origin:center;white-space:nowrap;animation:splash .55s ease-in-out infinite alternate}
@keyframes splash{to{scale:1.08}}
@keyframes logoIn{from{opacity:0;transform:translateY(-60px) scale(.8)}}
.menu{position:relative;margin-top:7vh;display:grid;gap:10px;width:min(420px,86vw);animation:fadeUp .9s .5s both}
.menu .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}}
.foot{position:absolute;bottom:6px;left:8px;right:8px;display:flex;justify-content:space-between;color:#fff;font-size:18px;text-shadow:2px 2px 0 #3f3f3f}

.mcb{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 14px;border:2px solid #000;cursor:pointer;color:#e0e0e0;text-shadow:2px 2px 0 #383838;background-color:#6f6f6f;background-size:48px 48px;image-rendering:pixelated;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -3px 0 rgba(0,0,0,.4);text-decoration:none;font-size:21px;white-space:nowrap}
.mcb:hover{color:#ffffa0;outline:2px solid #fff;outline-offset:-4px;filter:brightness(1.12) hue-rotate(-10deg)}
.mcb:active{filter:brightness(.9)}
.mcb:disabled{color:#a0a0a0;filter:grayscale(1) brightness(.75);cursor:default;outline:none}
select.mcb{appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center}
select.mcb option{background:#2b2b2b;color:#fff}

#hud{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#hud.on{display:block}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;translate:-50% -50%;mix-blend-mode:difference}
#cross::before,#cross::after{content:"";position:absolute;background:#fff}
#cross::before{left:10px;top:0;width:2px;height:22px}
#cross::after{left:0;top:10px;width:22px;height:2px}
#debug{position:absolute;left:6px;top:4px;font-size:19px;line-height:1.15}
#debug span{background:rgba(80,80,80,.55);padding:0 4px;display:inline-block}
#hotbar{position:absolute;left:50%;bottom:8px;translate:-50% 0;display:flex;padding:3px;background:rgba(0,0,0,.45);border:2px solid #222;box-shadow:inset 0 0 0 2px #8b8b8b}
.slot{width:46px;height:46px;position:relative;display:grid;place-items:center;border:2px solid transparent;border-color:#373737 #8b8b8b #8b8b8b #373737}
.slot canvas{width:34px;height:34px;image-rendering:pixelated}
.slot.sel{outline:3px solid #fff;outline-offset:-1px;z-index:1;box-shadow:0 0 0 2px #000}
#itemname{position:absolute;left:50%;bottom:72px;translate:-50% 0;font-size:22px;text-shadow:2px 2px 0 #3f3f3f;transition:opacity .4s;white-space:nowrap}
#target{position:absolute;left:50%;top:calc(50% + 26px);translate:-50% 0;font-size:20px;padding:2px 8px;background:rgba(16,0,16,.85);border:2px solid #25015b;box-shadow:inset 0 0 0 1px #5000aa;opacity:0;transition:opacity .15s;white-space:nowrap}
#target.on{opacity:1}
#target b{color:#55ffff;font-weight:400}
#target small{display:block;color:#aaaaaa;font-size:18px}
#chat{position:absolute;left:6px;bottom:78px;width:min(560px,70vw);display:flex;flex-direction:column;gap:0}
#chat div{background:rgba(0,0,0,.45);padding:1px 6px;transition:opacity 1s}
#chat div.old{opacity:0}
#chatin{position:fixed;left:6px;right:6px;bottom:4px;z-index:25;display:none;background:rgba(0,0,0,.6);border:0;color:#fff;padding:4px 8px;font-size:22px;outline:none}
#chatin.on{display:block}
.touchbtn{position:fixed;z-index:22;display:none;pointer-events:auto}

.overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:linear-gradient(rgba(16,16,16,.75),rgba(16,16,16,.85));padding:12px}
.overlay.on{display:flex}
.panel{background:#c6c6c6;border:3px solid;border-color:#fff #555 #555 #fff;outline:2px solid #000;color:#3f3f3f;padding:12px 14px;max-width:100%;max-height:100%;display:flex;flex-direction:column;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
.panel h2{margin:0 0 8px;font-weight:400;font-size:24px;color:#3f3f3f}
.pause{display:grid;gap:10px;width:min(420px,90vw)}
.pause h2{text-align:center;color:#fff;text-shadow:2px 2px 0 #3f3f3f;font-size:28px;margin-bottom:14px}
.pause .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.inv{width:min(760px,96vw)}
.inv .grp{margin-bottom:10px}
.inv .grp h3{margin:0 0 3px;font-weight:400;font-size:20px;color:#404040}
.inv .slots{display:flex;flex-wrap:wrap}
.inv .slot{width:54px;height:54px;background:#8b8b8b;cursor:pointer}
.inv .slot:hover{background:#c5c5c5}
.inv .slot canvas{width:40px;height:40px}
.inv .hint{color:#555;font-size:18px;margin-top:4px}
#tip{position:fixed;z-index:90;pointer-events:none;padding:4px 8px;background:rgba(16,0,16,.94);border:2px solid #25015b;box-shadow:inset 0 0 0 1px #5000aa;color:#fff;font-size:20px;display:none;max-width:340px}
#tip b{font-weight:400}
#tip .g{color:#aaaaaa}
#tip .c{color:#5555ff}

.qwin{width:min(1180px,98vw);height:min(88vh,860px)}
.qtabs{display:flex;gap:4px;margin:-4px 0 8px;flex-wrap:wrap}
.qtabs button{border:2px solid;border-color:#fff #555 #555 #fff;background:#a8a8a8;color:#3f3f3f;padding:3px 10px;cursor:pointer;font-size:20px}
.qtabs button.on{background:#c6c6c6;color:#000;border-color:#fff #555 #c6c6c6 #fff;position:relative;top:2px}
.qtabs button:hover{color:#000}
.qtop{display:flex;align-items:center;gap:10px}
.qtop h2{flex:1;margin:0}
.qbody{flex:1;min-height:0;display:flex;flex-direction:column}

.fp{display:flex;flex-direction:column;flex:1;min-height:0}
.fp-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fp-code{width:40px;height:40px;display:grid;place-items:center;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;color:#fff;text-shadow:2px 2px 0 #3f3f3f;font-size:18px}
.fp-titles{flex:1;min-width:0}
.fp-cat{color:#555;font-size:18px}
.fp-title{margin:0;font-weight:400;font-size:24px;color:#3f3f3f;line-height:1}
.fp-ep{color:#3a6cd8;font-size:18px;word-break:break-all}
.fp-actions:empty{display:none}
.fp-form{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-bottom:4px}
.fp-modes{display:flex;gap:6px;width:100%}
.fp-modes button{flex:1;height:34px;border:2px solid #000;background:#6f6f6f;color:#e0e0e0;text-shadow:2px 2px 0 #383838;cursor:pointer;box-shadow:inset 2px 2px 0 rgba(255,255,255,.3),inset -2px -2px 0 rgba(0,0,0,.4)}
.fp-modes button.on{background:#7b8fbf;color:#ffffa0}
.fp-field{display:flex;flex-direction:column;gap:2px;color:#404040;font-size:19px}
.fp-field[hidden]{display:none}
.fp-field.fp-wide{width:100%}
.fp-field input,.fp-field select{height:32px;background:#000;border:2px solid #a0a0a0;color:#e0e0e0;padding:0 6px;min-width:150px;outline:none;font-size:21px}
.fp-field input:focus,.fp-field select:focus{border-color:#fff}
.fp-items{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.fp-item{display:flex;gap:6px;align-items:center}
.fp-item .fp-ip{width:140px;min-width:0}.fp-item .fp-ic{width:70px;min-width:0}
.fp-btn{height:34px;padding:0 12px;border:2px solid #000;background:#6f6f6f;color:#e0e0e0;text-shadow:2px 2px 0 #383838;cursor:pointer;font-size:20px;box-shadow:inset 2px 2px 0 rgba(255,255,255,.3),inset -2px -2px 0 rgba(0,0,0,.4)}
.fp-btn:hover{color:#ffffa0;outline:2px solid #fff;outline-offset:-4px}
.fp-btn.fp-sm{height:30px;font-size:19px}
.fp-run{background:#3c8527;min-width:150px}
.fp-run:disabled{filter:grayscale(1);cursor:wait}
.fp-bar{display:flex;gap:10px;align-items:center;margin:6px 0 8px;flex-wrap:wrap}
.fp-seg{display:inline-flex;gap:4px}
.fp-seg button{height:30px;border:2px solid;border-color:#fff #555 #555 #fff;background:#a8a8a8;color:#3f3f3f;padding:0 10px;cursor:pointer;font-size:19px}
.fp-seg button.on{border-color:#555 #fff #fff #555;background:#8b8b8b;color:#fff}
.fp-stat{margin-left:auto;color:#404040;font-size:19px}
.fp-stat b{color:#000;font-weight:400}
.fp-out{flex:1;min-height:0;overflow:auto;background:#1d1d1d;border:2px solid;border-color:#373737 #fff #fff #373737;padding:8px;color:#e0e0e0}
.fp-sec{margin-bottom:12px}
.fp-sec h4{margin:0 0 4px;font-weight:400;color:#ffff55;font-size:21px;text-shadow:2px 2px 0 #3f3f00}
.fp-table{border-collapse:collapse;width:100%;font-size:20px}
.fp-table th{position:sticky;top:-8px;background:#2b2b2b;text-align:left;font-weight:400;color:#55ffff;padding:3px 10px;cursor:pointer;white-space:nowrap;border-bottom:2px solid #555}
.fp-table th[data-s]::after{content:attr(data-s);margin-left:4px;font-size:14px}
.fp-table td{padding:2px 10px;white-space:nowrap;text-shadow:2px 2px 0 #000}
.fp-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.04)}
.fp-table tbody tr:hover td{background:rgba(85,255,85,.12)}
.fp-r{text-align:right!important}
.fp-chip{padding:0}
.fp-ok{color:#55ff55}.fp-warn{color:#ffff55}.fp-bad{color:#ff5555}.fp-info{color:#55ffff}
.fp-barcell{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.fp-track{width:100px;height:10px;background:#000;border:1px solid #555}
.fp-track i{display:block;height:100%;background:#80ff20}
.fp-empty{padding:24px;text-align:center;color:#aaa}
.fp-json{margin:0;font:19px/1.1 var(--mc-font);color:#55ff55;white-space:pre-wrap;word-break:break-word}
.fp-error{color:#ff5555;white-space:pre-wrap}
.fp-error b{display:block;font-weight:400;color:#ff5555}
.fp-error div{color:#ffaaaa}
.fp-note{color:#aaaaaa}
.fp-loading{padding:24px;text-align:center;color:#e0e0e0}
.fp-loading i{display:inline-block;width:10px;height:10px;background:#80ff20;margin:0 3px;animation:blink .9s steps(2) infinite}
.fp-loading i:nth-child(2){animation-delay:.3s}.fp-loading i:nth-child(3){animation-delay:.6s}
.fp-loading span{display:block;margin-top:6px}
@keyframes blink{50%{opacity:.15}}

@media (max-width:700px){
  .slot{width:36px;height:36px}.slot canvas{width:26px;height:26px}
  #debug{font-size:16px}
  .touchbtn{display:flex}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading" class="dirt">
  <div class="lt sh">Generando mundo</div>
  <div class="ls sh" id="lstep">Preparando terreno...</div>
  <div class="lbar"><i id="lbar"></i></div>
</div>

<div id="title" style="display:none">
  <div class="logo">
    <h1 id="logoTxt">FARMACRAFT</h1>
    <div class="ed">EDICIÓN BASES DE DATOS II</div>
    <div class="splash" id="splash"></div>
  </div>
  <div class="menu">
    <button class="mcb" id="play">Entrar al mundo</button>
    <button class="mcb" id="tinv">Ver consultas</button>
    <div class="row">
      <button class="mcb" id="tsound"></button>
      <span id="tthemes"></span>
    </div>
    <a class="mcb" id="tdocs" target="_blank" rel="noopener">Abrir Swagger de la API</a>
  </div>
  <div class="foot"><span>FarmaCraft 1.0 · MongoDB + Redis</span><span id="tapi">API: ...</span></div>
</div>

<div id="hud">
  <div id="cross"></div>
  <div id="debug"></div>
  <div id="target"></div>
  <div id="chat"></div>
  <div id="itemname"></div>
  <div id="hotbar"></div>
</div>
<button class="mcb touchbtn" id="touchInv" style="right:8px;bottom:70px">Consultas</button>
<input id="chatin" maxlength="80" autocomplete="off" spellcheck="false" placeholder="Escribí /ayuda">

<div class="overlay" id="pause">
  <div class="pause">
    <h2>Menú del juego</h2>
    <button class="mcb" id="resume">Volver al juego</button>
    <button class="mcb" id="pinv">Consultas (E)</button>
    <div class="row"><button class="mcb" id="psound"></button><button class="mcb" id="preset">Regenerar mundo</button></div>
    <div class="row"><a class="mcb" id="pdocs" target="_blank" rel="noopener">Swagger</a><span id="pthemes"></span></div>
    <button class="mcb" id="ptitle">Volver al título</button>
  </div>
</div>

<div class="overlay" id="invov">
  <div class="panel inv">
    <h2>Consultas de FarmaRed</h2>
    <div id="invgrid"></div>
    <div class="hint">Clic en un bloque para abrir la consulta · E o Esc para cerrar</div>
  </div>
</div>

<div class="overlay" id="qov">
  <div class="panel qwin">
    <div class="qtop"><h2 id="qst"></h2><button class="fp-btn" id="qclose">Cerrar (Esc)</button></div>
    <div class="qtabs" id="qtabs"></div>
    <div class="qbody" id="qbody"></div>
  </div>
</div>
<div id="tip"></div>

<script>
(() => {
"use strict";
const F = window.Farma, { el } = F;
const $ = id => document.getElementById(id);
if (!window.THREE) {
  document.body.innerHTML = '<div style="padding:40px;font:22px VT323,monospace;color:#fff">No se pudo cargar Three.js desde el CDN. FarmaCraft necesita internet para la librería 3D.</div>';
  return;
}

let seed = 1337;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const pickc = a => a[Math.floor(rnd() * a.length)];

const TILE = 16;
const TILES = ["grass_top", "grass_side", "dirt", "stone", "cobble", "planks", "log_side", "log_top", "leaves", "glass", "quartz", "green", "lamp", "bricks", "shelf", "books"];
const AT = 4;
const atlas = document.createElement("canvas");
atlas.width = atlas.height = TILE * AT;
const ag = atlas.getContext("2d");
const tilePos = {};
const tileCanvas = {};

function paintTile(name, g) {
  const px = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
  const fill = cs => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, pickc(cs)); };
  const DIRT = ["#866043", "#79553a", "#966c4a", "#8b6a4d", "#79553a", "#6c4c33"];
  const STONE = ["#7d7d7d", "#747474", "#8a8a8a", "#6b6b6b", "#7f7f7f", "#868686"];
  const PL = ["#a0824f", "#9a7b48", "#b08f58", "#a5854f"];
  if (name === "dirt") fill(DIRT);
  else if (name === "grass_top") fill(["#5f9f35", "#6aab3d", "#579130", "#74b44a", "#64a43a"]);
  else if (name === "grass_side") {
    fill(DIRT);
    for (let x = 0; x < 16; x++) {
      const d = 2 + Math.floor(rnd() * 3);
      for (let y = 0; y < d; y++) px(x, y, pickc(["#5f9f35", "#6aab3d", "#579130", "#74b44a"]));
    }
  } else if (name === "stone") fill(STONE);
  else if (name === "cobble") {
    fill(["#5a5a5a", "#636363"]);
    for (let i = 0; i < 14; i++) {
      const x = Math.floor(rnd() * 14), y = Math.floor(rnd() * 14), w = 2 + Math.floor(rnd() * 4), h = 2 + Math.floor(rnd() * 3), c = pickc(["#8f8f8f", "#7f7f7f", "#9a9a9a", "#868686"]);
      for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) px((x + xx) % 16, (y + yy) % 16, yy === h - 1 || xx === w - 1 ? "#4f4f4f" : c);
    }
  } else if (name === "planks") {
    fill(PL);
    for (let y = 0; y < 16; y += 4) for (let x = 0; x < 16; x++) px(x, y + 3, "#7a5f36");
    for (let r = 0; r < 4; r++) { const x = (r * 7 + 3) % 16; for (let y = 0; y < 3; y++) px(x, r * 4 + y, "#86683c"); }
  } else if (name === "log_side") {
    for (let x = 0; x < 16; x++) { const c = pickc(["#6b5132", "#5a4328", "#7a5c38", "#634a2d"]); for (let y = 0; y < 16; y++) px(x, y, rnd() < .2 ? pickc(["#4e3a22", "#6b5132"]) : c); }
  } else if (name === "log_top") {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const d = Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5));
      px(x, y, d > 6.5 ? "#5a4328" : (Math.floor(d) % 2 ? "#b8945f" : "#a07f4c"));
    }
  } else if (name === "leaves") {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      if (rnd() < .16) { g.clearRect(x, y, 1, 1); continue; }
      px(x, y, pickc(["#3c7a26", "#2f6a1e", "#4a8a2f", "#356f22", "#28581a"]));
    }
  } else if (name === "glass") {
    g.clearRect(0, 0, 16, 16);
    for (let i = 0; i < 16; i++) { px(i, 0, "#dbeefc"); px(i, 15, "#a9c8de"); px(0, i, "#dbeefc"); px(15, i, "#a9c8de"); }
    for (const [x, y] of [[3, 3], [4, 4], [5, 5], [4, 3], [10, 9], [11, 10], [9, 3], [10, 2]]) px(x, y, "#f4fbff");
  } else if (name === "quartz") {
    fill(["#ecebe4", "#e7e5dd", "#f1f0ea", "#e9e7df"]);
    for (let i = 0; i < 16; i++) { px(i, 0, "#f8f8f4"); px(0, i, "#f8f8f4"); px(i, 15, "#cfccc2"); px(15, i, "#cfccc2"); }
  } else if (name === "green") fill(["#3fae48", "#359c3e", "#4cc255", "#3aa443"]);
  else if (name === "lamp") {
    fill(["#d9a441", "#e3b04d", "#cf9a3a"]);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      if (x % 5 === 0 || y % 5 === 0) px(x, y, "#8a6326");
      else if (rnd() < .45) px(x, y, pickc(["#ffe08a", "#fff1b8", "#ffd36b"]));
    }
  } else if (name === "bricks") {
    fill(["#7a7a7a", "#727272", "#818181"]);
    for (let y = 0; y < 16; y += 4) {
      for (let x = 0; x < 16; x++) px(x, y + 3, "#555");

function burst(x, y, z, id) {
  const tc = tileCanvas[B[id] ? B[id].t[2] : "stone"].getContext("2d");
  for (let i = 0; i < 14; i++) {
    const d = tc.getImageData(Math.floor(rnd() * 16), Math.floor(rnd() * 16), 1, 1).data;
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(`rgb(${d[0]},${d[1]},${d[2]})`) }));
    m.position.set(x + .2 + rnd() * .6, y + .2 + rnd() * .6, z + .2 + rnd() * .6);
    m.userData = { v: new THREE.Vector3((rnd() - .5) * 3, 2 + rnd() * 2.5, (rnd() - .5) * 3), life: .6 + rnd() * .4 };

const player = { p: new THREE.Vector3(0, H, 18), v: new THREE.Vector3(), yaw: 0, pitch: -.05, ground: false };
const keys = {};

function collides(p) {
  const r = .3;
  for (let x = Math.floor(p.x - r); x <= Math.floor(p.x + r); x++)
    for (let y = Math.floor(p.y); y <= Math.floor(p.y + 1.79); y++)
      for (let z = Math.floor(p.z - r); z <= Math.floor(p.z + r); z++)
        if (solid(getB(x, y, z))) return true;
  return false;
}
function physics(dt) {
  const sp = keys.ControlLeft || keys.ShiftLeft ? 6 : 4.4;
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) { mx += fx; mz += fz; }
  if (keys.KeyS || keys.ArrowDown) { mx -= fx; mz -= fz; }
  if (keys.KeyA || keys.ArrowLeft) { mx += fz; mz -= fx; }
  if (keys.KeyD || keys.ArrowRight) { mx -= fz; mz += fx; }
  const ml = Math.hypot(mx, mz) || 1;
  const target = new THREE.Vector3(mx / ml * sp, 0, mz / ml * sp);
  const acc = player.ground ? 14 : 4;
  player.v.x += (target.x - player.v.x) * Math.min(1, acc * dt);
  player.v.z += (target.z - player.v.z) * Math.min(1, acc * dt);
  player.v.y -= 30 * dt;
  if (keys.Space && player.ground) { player.v.y = 8.6; player.ground = false; }
  const p = player.p;
  for (const ax of ["x", "z", "y"]) {
    const old = p[ax];
    p[ax] += player.v[ax] * dt;
    if (collides(p)) {
      if (ax !== "y" && player.ground && !collides(new THREE.Vector3(p.x, p.y + 1.01, p.z).setComponent(ax === "x" ? 0 : 2, p[ax]))) {
        p.y = Math.floor(p.y) + 1.001;
        if (!collides(p)) continue;
        p.y -= 1;
      }
      p[ax] = old;
      if (ax === "y") { if (player.v.y < 0) player.ground = true; player.v.y = 0; }
      else player.v[ax] = 0;
    } else if (ax === "y") player.ground = false;
  }
  if (p.y < -10) respawn();
}
function respawn() { player.p.set(0, H, 18); player.v.set(0, 0, 0); player.yaw = 0; player.pitch = -.05; }

function raycast() {
  const o = camera.position, d = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  let x = Math.floor(o.x), y = Math.floor(o.y), z = Math.floor(o.z);
  const sx = Math.sign(d.x), sy = Math.sign(d.y), sz = Math.sign(d.z);
  const td = v => (v === 0 ? Infinity : Math.abs(1 / v));
  const dx = td(d.x), dy = td(d.y), dz = td(d.z);
  let tx = d.x > 0 ? (x + 1 - o.x) * dx : (o.x - x) * dx;
  let ty = d.y > 0 ? (y + 1 - o.y) * dy : (o.y - y) * dy;
  let tz = d.z > 0 ? (z + 1 - o.z) * dz : (o.z - z) * dz;
  let n = [0, 0, 0], t = 0;
  while (t < 6) {
    const id = getB(x, y, z);
    if (id && t > 0) return { x, y, z, id, n };
    if (tx < ty && tx < tz) { x += sx; t = tx; tx += dx; n = [-sx, 0, 0]; }
    else if (ty < tz) { y += sy; t = ty; ty += dy; n = [0, -sy, 0]; }
    else { z += sz; t = tz; tz += dz; n = [0, 0, -sz]; }
  }
  return null;
}

let swing = 0;
function act(button) {
  const hit = raycast();
  swing = 1;
  if (!hit) return;
  if (hit.id === QBLOCK) {
    const q = QPOS.get([hit.x, hit.y, hit.z].join(","));
    if (q) openQuery(q.station, q.code);
    return;
  }
  if (button === 0) {
    if (hit.y <= 0) return;
    setB(hit.x, hit.y, hit.z, 0);
    burst(hit.x, hit.y, hit.z, hit.id);
    rebuildAround(hit.x, hit.z);
    F.Sound.noise(0, .14, .12, 600 + Math.random() * 500);
  } else if (button === 2) {
    const px = hit.x + hit.n[0], py = hit.y + hit.n[1], pz = hit.z + hit.n[2];
    if (!inside(px, py, pz) || getB(px, py, pz)) return;
    setB(px, py, pz, HOTBAR[selSlot]);
    if (collides(player.p)) { setB(px, py, pz, 0); return; }
    rebuildAround(px, pz);
    F.Sound.noise(0, .1, .1, 350);
  }
}

const chatin = $("chatin");
function openChat(prefix) {

  if (e.key !== "Enter") return;
  const v = chatin.value.trim();
  chatin.classList.remove("on");
  mode = "play";
  if (v) command(v);
  if (mode === "play") lock();
});
function command(v) {
  const [cmd, arg = ""] = v.replace(/^\//, "").split(/\s+/);
  const c = cmd.toLowerCase();
  if (!v.startsWith("/")) { chat(`<Farmacéutico> ${v}`); return; }
  if (c === "ayuda" || c === "help") {
    chat("Comandos: /q 07 · /tp caja|estanteria|recetas|clientes|gerencia · /spawn · /consultas", "#ffff55");
  } else if (c === "q") {
    const q = F.byCode("Q" + String(+arg).padStart(2, "0"));
    if (!q) { chat(`No existe la consulta ${arg}`, "#ff5555"); return; }
    const st = F.STATIONS.find(s => s.queries.includes(q.code));
    openQuery(st.id, q.code);
  } else if (c === "tp") {
    const s = STATIONS[arg.toLowerCase()];
    if (!s) { chat("Estaciones: caja, estanteria, recetas, clientes, gerencia", "#ff5555"); return; }
    player.p.set(s.spawn[0] + .5, s.spawn[1], s.spawn[2] + .5); player.v.set(0, 0, 0);
    player.yaw = s.spawn[3]; player.pitch = -.25;

  else if (c === "consultas") openInventory();
  else chat(`Comando desconocido. Probá /ayuda`, "#ff5555");
}

const clock = new THREE.Clock();
let fps = 0, fpsAcc = 0, fpsN = 0, lastTarget = null;
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > .5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (playing) {
    if (mode === "play") physics(dt);
    camera.position.set(player.p.x, player.p.y + 1.62, player.p.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
    const bob = Math.hypot(player.v.x, player.v.z) > .5 && player.ground ? Math.sin(t * 10) : 0;
    swing = Math.max(0, swing - dt * 5);
    held.visible = playing;
    held.position.set(.55 + bob * .015, -.5 + Math.abs(bob) * .02 - Math.sin(swing * Math.PI) * .08, -.85 - Math.sin(swing * Math.PI) * .1);
    held.rotation.set(.1 - Math.sin(swing * Math.PI) * .5, -.7, 0);
    const hit = mode === "play" ? raycast() : null;
    outline.visible = !!hit;
    if (hit) outline.position.set(hit.x + .5, hit.y + .5, hit.z + .5);
    const q = hit && hit.id === QBLOCK ? QPOS.get([hit.x, hit.y, hit.z].join(",")) : null;
    const key = q ? q.code : null;
    if (key !== lastTarget) {
      lastTarget = key;
      const tg = $("target");
      if (q) {
        const qq = F.byCode(q.code);
        tg.replaceChildren(el("b", { text: `${qq.code} · ${qq.short}` }), el("small", { text: "Clic para abrir la consulta" }));
        tg.classList.add("on");
      } else tg.classList.remove("on");
    }
    const p = player.p;
    const dirs = ["norte", "oeste", "sur", "este"];
    const facing = dirs[((Math.round(player.yaw / (Math.PI / 2)) % 4) + 4) % 4];
    $("debug").replaceChildren(
      el("span", { text: `FarmaCraft 1.0 (${fps} fps)` }), el("br"),
      el("span", { text: `XYZ: ${p.x.toFixed(1)} / ${p.y.toFixed(1)} / ${p.z.toFixed(1)}  Mirando: ${facing}` }), el("br"),
      el("span", { text: snapInfo.online == null ? "API: ..." : snapInfo.online ? `API: en línea · ${snapInfo.prods} productos · ${snapInfo.lotes} lotes < 50 · ${snapInfo.pend} ventas pendientes` : "API: sin conexión" }));
  } else {
    const a = t * .06;
    camera.position.set(Math.sin(a) * 15, H + 8.5, Math.cos(a) * 15 + 4);
    camera.lookAt(0, H + 3, 0);
    held.visible = false;
    outline.visible = false;
  }
  for (const m of qMeshes) m.material.color.setScalar(.85 + .15 * Math.sin(t * 3 + m.position.x));
  for (let i = parts.length - 1; i >= 0; i--) {
    const m = parts[i], u = m.userData;
    u.life -= dt;
    u.v.y -= 18 * dt;
    m.position.addScaledVector(u.v, dt);
    if (u.life <= 0) { scene.remove(m); m.material.dispose(); parts.splice(i, 1); }
  }
  clouds.position.x = (t * 1.2) % 140;
  sun.position.set(camera.position.x + 60, camera.position.y + 70, camera.position.z - 80);
  sun.lookAt(camera.position);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

async function boot() {
  const step = (txt, p) => { $("lstep").textContent = txt; $("lbar").style.width = p + "%"; return new Promise(r => setTimeout(r, 160)); };
  await step("Generando terreno...", 10);
  generate();
  await step("Construyendo la farmacia...", 35);
  buildAll();
  await step("Colocando bloques de consulta...", 60);
  placeQueryBlocks();
  try { await document.fonts.load("48px VT323"); } catch {}
  placeTags();
  await step("Conectando con MongoDB y Redis...", 80);
  await refreshDebug();
  await step(snapInfo.online ? "Datos cargados" : "La API no responde, el mundo funciona igual", 100);
  await new Promise(r => setTimeout(r, 350));
  $("loading").style.display = "none";
  $("title").style.display = "flex";
  mode = "title";
  loop();
}
setInterval(() => { if (playing) refreshDebug(); }, 30000);
boot();
})();
</script>
</body>
</html>
