<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>FarmaCampus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="core.js"></script>
<style>
:root{--nav:#262626;--nav2:#3a3a3a;--accent:#1f9a6e;--link:#1f6fd1;--text:#262626;--muted:#6b6b6b;--line:#e0e0e0;--bg:#f8f8f8;--red:#d0021b;--orange:#e07a00;--purple:#7a5af5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 "Open Sans",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
.lnk{color:var(--link);font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-decoration:none}
.lnk:hover{text-decoration:underline}

#app{position:fixed;inset:0;display:grid;grid-template-columns:260px 1fr}
.nav{background:var(--nav);color:#e5e5e5;display:flex;flex-direction:column;min-height:0}
.inst{height:70px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--nav2);flex:none}
.inst .lg{width:36px;height:36px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.inst b{font:800 15px "Open Sans";letter-spacing:.02em;color:#fff}
.inst small{display:block;font:600 11px "Open Sans";color:#a8a8a8}
.me{display:flex;align-items:center;gap:12px;padding:18px 20px}
.av{width:44px;height:44px;border-radius:50%;background:var(--purple);display:grid;place-items:center;color:#fff;font:700 15px "Open Sans";flex:none}
.me b{font:700 15px "Open Sans";color:#fff}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:11px 22px;font:600 14px "Open Sans";color:#d4d4d4;border:0;border-left:4px solid transparent;background:none;cursor:pointer;text-align:left}
.it:hover{background:#303030}
.it svg{width:20px;height:20px;stroke:#bdbdbd;fill:none;stroke-width:1.8;flex:none}
.it.on{background:var(--nav2);border-left-color:#4fc7a0;color:#fff}
.it.on svg{stroke:#fff}
.it .n{margin-left:auto;background:var(--red);color:#fff;font:700 11px "Open Sans";border-radius:10px;padding:1px 7px}
.it .n:empty{display:none}
.sep{height:1px;background:var(--nav2);margin:8px 0}
.out{margin-top:auto;padding:16px 22px;font:600 13px "Open Sans";color:#a8a8a8;border-top:1px solid var(--nav2);display:flex;align-items:center;gap:8px}
.out i{width:8px;height:8px;border-radius:50%;background:#888}
.out i.ok{background:#4fc7a0}.out i.bad{background:#ff5a5f}

.pg{overflow-y:auto;padding:30px 44px 40px;min-width:0}
.pg h1{margin:0 0 18px;font:300 30px "Open Sans"}
.sec{font:700 12px "Open Sans";letter-spacing:.08em;color:var(--muted);margin:22px 0 10px;text-transform:uppercase}
.act{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:8px;animation:fin .35s ease both}
@keyframes fin{from{opacity:0;transform:translateY(6px)}}
.act .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 15px "Open Sans";color:#fff}
.act b{font:600 14.5px "Open Sans"}
.act p{margin:2px 0 0;color:#5c5c5c;font-size:13.5px}
.act small{display:block;margin-top:6px;color:#8a8a8a;font-size:12px}
.act .lnk{margin-left:auto;white-space:nowrap}
.act.imp{border-left:4px solid var(--red)}
.skel{height:76px;border-radius:4px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s linear infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;transition:box-shadow .2s}
.ccard:hover{box-shadow:0 6px 18px rgba(0,0,0,.12)}
.ccard .img{height:120px;background:linear-gradient(115deg,#0e3b5c,#13607a 50%,#1f9a6e);position:relative}
.ccard .img::after{content:"";position:absolute;right:20px;top:20px;width:80px;height:80px;border:3px solid rgba(255,255,255,.3);border-radius:16px;transform:rotate(12deg)}
.ccard .cb2{padding:14px 16px}
.ccard small{color:var(--muted);font:600 12px "Open Sans"}
.ccard b{display:block;font:700 16px "Open Sans";color:var(--link);margin:2px 0}
.tools{display:grid;gap:12px;max-width:640px}
.tool{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.tool b{flex:1;font:600 14.5px "Open Sans"}
.tool small{display:block;font:400 12.5px "Open Sans";color:var(--muted)}
.tool select,.tool input{height:34px;border:1px solid #cfcfcf;border-radius:4px;padding:0 10px;background:#fff;min-width:200px}

.layer{position:fixed;top:0;bottom:0;right:0;left:56px;z-index:20;background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.layer.on{transform:none}
.dim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.dim.on{opacity:1;visibility:visible}
.lh{height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 22px/1 "Open Sans";color:var(--text);border:1px solid #cfcfcf;background:#fff;cursor:pointer;flex:none}
.x:hover{background:#f2f2f2}
.lh h2{margin:0;font:600 19px "Open Sans"}
.lh small{color:var(--muted);font:600 12px "Open Sans"}
.lh .sv{margin-left:auto}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{padding:13px 12px 11px;font:600 13.5px "Open Sans";color:#5c5c5c;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.lbody{flex:1;min-height:0;display:grid;grid-template-columns:270px 1fr;overflow:hidden}
.da{padding:22px 24px;border-right:1px solid #ececec;background:#fafafa;overflow-y:auto}
.da h3{margin:0 0 14px;font:700 15px "Open Sans"}
.dai{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.dai svg{flex:none;width:22px;height:22px;stroke:#5c5c5c;fill:none;stroke-width:1.7;margin-top:1px}
.dai b{display:block;font:600 13.5px "Open Sans"}
.dai span{font:600 12.5px "Open Sans";color:var(--link)}
.main{padding:22px 34px 40px;overflow-y:auto;min-width:0}
.main.full{grid-column:1/-1}
.main h3{margin:0 0 14px;font:600 20px "Open Sans";display:flex;align-items:center;gap:10px}
.main h3 .lnk{margin-left:auto;font-size:13px}
.ins{position:relative;height:14px}
.ins::before{content:"";position:absolute;left:0;right:0;top:6px;border-top:1px dashed transparent;transition:border-color .2s}
.ins i{position:absolute;left:50%;top:-4px;translate:-50% 0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 16px/1 "Open Sans";font-style:normal;opacity:0;transition:opacity .2s}
.ins:hover::before{border-top-color:var(--accent)}.ins:hover i{opacity:1}
.ci{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid #e3e3e3;border-radius:4px;background:#fff;cursor:pointer}
.ci:hover{background:#fbfbfb}
.ico{flex:none;width:40px;height:40px;border-radius:6px;display:grid;place-items:center}
.ico svg{width:24px;height:24px;fill:none;stroke-width:1.8}
.ci .tt{min-width:0}
.ci b{font:600 14.5px "Open Sans";color:var(--link)}
.ci p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.ci .r{margin-left:auto;display:flex;align-items:center;gap:18px;font:600 12.5px "Open Sans";color:#5c5c5c;white-space:nowrap}
.vis{display:flex;align-items:center;gap:6px;color:var(--accent)}
.vis::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chev{font:700 13px "Open Sans";color:#5c5c5c;width:16px;flex:none;transition:transform .2s}
.fold.open .chev{transform:rotate(90deg)}
.fold .sub{display:none;margin-left:54px;border-left:2px solid #e3e3e3;padding-left:16px}
.fold.open .sub{display:block}
.fold .sub .ci{border:0;border-bottom:1px solid #f0f0f0;border-radius:0;padding:10px 6px;background:transparent}
.ok{color:#127a46}.bad{color:#b0132a}

.cal{display:grid;grid-template-columns:1fr 300px;gap:24px}
.calh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.calh b{font:600 18px "Open Sans";min-width:200px}
.calh button{width:32px;height:32px;border:1px solid #cfcfcf;border-radius:4px;background:#fff;cursor:pointer}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.grid7 .hd{padding:6px 8px;font:700 11.5px "Open Sans";color:var(--muted);text-transform:uppercase;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafafa}
.day{min-height:92px;padding:6px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;font-size:12px}
.day.off{background:#fafafa;color:#bbb}
.day.today .dn{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.dn{font:700 12px "Open Sans";margin-bottom:4px}
.ev{display:block;margin-bottom:3px;padding:2px 6px;border-radius:3px;font:600 11px "Open Sans";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.agenda .ev{white-space:normal;font-size:12.5px;padding:8px 10px;margin-bottom:6px}

.thread{max-width:860px}
.post{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eee;animation:fin .35s ease both}
.post .av{width:38px;height:38px;font-size:13px}
.post b{font:700 14px "Open Sans"}
.post small{color:#8a8a8a;margin-left:8px;font-size:12px}
.post p{margin:4px 0 0;color:#3a3a3a}
.post.reply{margin-left:50px}
.post .tag{display:inline-block;margin-top:6px;font:700 11px "Open Sans";padding:2px 8px;border-radius:3px}
.find{display:flex;gap:8px;margin-bottom:14px}
.find input{height:38px;border:1px solid #cfcfcf;border-radius:4px;padding:0 12px;width:200px}
.btn{height:38px;padding:0 16px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:#fff;font:600 13.5px "Open Sans";cursor:pointer}
.btn.sec2{background:#fff;color:var(--text);border-color:#cfcfcf}

.gbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sw{display:flex;border:1px solid #cfcfcf;border-radius:4px;overflow:hidden}
.sw button{padding:6px 14px;font:600 13px "Open Sans";color:#5c5c5c;border:0;background:#fff;cursor:pointer}
.sw button.on{background:var(--nav);color:#fff}
table.gt{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line)}
.gt th{font:600 12.5px "Open Sans";color:#5c5c5c;text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);background:#fafafa;white-space:nowrap}
.gt th small{display:block;font:400 11.5px "Open Sans";color:#8a8a8a}
.gt td{padding:11px 12px;border-bottom:1px solid #eee;font-size:13.5px}
.pp{display:flex;align-items:center;gap:10px}
.pp i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 11px "Open Sans";color:#fff;font-style:normal;flex:none}
.pp small{display:block;color:#8a8a8a;font-size:11.5px}
.g{display:inline-block;min-width:64px;text-align:center;padding:4px 8px;border-radius:3px;font:700 13px "Open Sans"}
.g.a{background:#e3f4ea;color:#127a46}.g.b{background:#fff3d6;color:#8a5a00}.g.c{background:#fde4e6;color:#b0132a}.g.n{background:#f2f2f2;color:#8a8a8a}

.peek{position:fixed;top:0;bottom:0;right:0;width:min(1060px,94vw);z-index:30;background:#fff;box-shadow:-10px 0 30px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.peek.on{transform:none}
.pbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.pbody.ent{grid-template-columns:1fr 360px}
.pmain{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.consigna{margin:16px 22px 0;padding:12px 16px;border-left:4px solid var(--accent);background:#f3faf7;border-radius:0 6px 6px 0;color:#2f3b4c}
.grade{margin:16px 22px 16px 0;border:1px solid var(--line);border-radius:6px;overflow:auto;align-self:start}
.grade .gh{padding:18px 20px;background:#9aa4b2;color:#fff}
.grade.okg .gh{background:linear-gradient(135deg,#1fb37a,#0e8a7a)}
.grade.badg .gh{background:linear-gradient(135deg,#e5484d,#b0132a)}
.grade .gh small{font:600 11.5px "Open Sans";letter-spacing:.12em;opacity:.9}
.grade .gh b{display:block;font:800 36px/1.1 "Open Sans";margin-top:4px}
.grade .gb{padding:14px 18px}
.chk{display:flex;gap:10px;padding:8px 0;font:400 13px "Open Sans";border-top:1px solid #f2f2f2}
.chk:first-child{border-top:0}
.chk i{flex:none;width:20px;height:20px;border-radius:50%;background:#1fb37a;color:#fff;font:800 11px/20px "Open Sans";text-align:center;font-style:normal}
.chk.x i{background:#b0132a}
.chk code{font:600 12px ui-monospace,Menlo,monospace;color:#13607a}
.fb{margin-top:10px;padding:12px;border-radius:6px;background:#f5f6f8;font:400 13px/1.5 "Open Sans";color:#3a4556}
.fb b{display:block;font:700 12px "Open Sans";color:var(--accent);margin-bottom:2px}

.fp{display:flex;flex-direction:column;flex:1;min-height:0}
.fp-head{display:flex;align-items:center;gap:12px;padding:16px 22px 6px}
.fp-code{font:700 12.5px ui-monospace,Menlo,monospace;color:#13607a;background:#e8f3f6;border-radius:4px;padding:4px 8px}
.fp-titles{flex:1;min-width:0}
.fp-cat{font:700 11px "Open Sans";letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.fp-title{margin:0;font:600 18px "Open Sans"}
.fp-ep{font:12.5px ui-monospace,Menlo,monospace;color:var(--muted);word-break:break-all}
.fp-actions:empty{display:none}
.fp-form{display:flex;flex-wrap:wrap;gap:12px 16px;padding:8px 22px 2px;align-items:flex-end}
.fp-modes{display:flex;width:100%;border:1px solid #cfcfcf;border-radius:4px;overflow:hidden}
.fp-modes button{flex:1;height:36px;border:0;background:#fff;font:600 13.5px "Open Sans";cursor:pointer;color:#5c5c5c}
.fp-modes button+button{border-left:1px solid #cfcfcf}
.fp-modes button.on{background:var(--nav);color:#fff}
.fp-field{display:flex;flex-direction:column;gap:5px;font:600 12.5px "Open Sans";color:#4a5566}
.fp-field[hidden]{display:none}
.fp-field.fp-wide{width:100%}
.fp-field input,.fp-field select{height:38px;min-width:170px;border:1px solid #cfcfcf;border-radius:4px;padding:0 10px;font:400 14px "Open Sans";outline:none;background:#fff}
.fp-field input:focus,.fp-field select:focus{border-color:var(--link);box-shadow:0 0 0 2px rgba(31,111,209,.15)}
.fp-items{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fp-item{display:flex;gap:6px;align-items:center}
.fp-item .fp-ip{width:160px;min-width:0}.fp-item .fp-ic{width:76px;min-width:0}
.fp-btn{height:38px;padding:0 16px;border:1px solid #cfcfcf;border-radius:4px;background:#fff;font:600 13.5px "Open Sans";cursor:pointer}
.fp-btn:hover{background:#f5f5f5}
.fp-btn.fp-sm{height:30px;font-size:12.5px}
.fp-run{background:var(--accent);border-color:var(--accent);color:#fff;min-width:140px}
.fp-run:hover{background:#178a61}
.fp-run:disabled{opacity:.6;cursor:wait}
.fp-bar{display:flex;gap:10px;align-items:center;padding:12px 22px;flex-wrap:wrap}
.fp-seg{display:inline-flex;border:1px solid #cfcfcf;border-radius:4px;overflow:hidden}
.fp-seg button{border:0;background:#fff;padding:6px 12px;font:600 12.5px "Open Sans";cursor:pointer;color:#5c5c5c}
.fp-seg button.on{background:var(--nav);color:#fff}
.fp-stat{margin-left:auto;font:600 12.5px "Open Sans";color:var(--muted)}
.fp-stat b{color:var(--text)}
.fp-out{flex:1;min-height:0;overflow:auto;padding:0 22px 22px}
.fp-sec{margin-bottom:16px}
.fp-sec h4{margin:0 0 8px;font:700 14px "Open Sans"}
.fp-tablewrap{border:1px solid var(--line);overflow:auto}
.fp-table{border-collapse:collapse;width:100%;font-size:13.5px}
.fp-table th{position:sticky;top:0;background:#fafafa;text-align:left;font:600 12.5px "Open Sans";color:#5c5c5c;padding:10px 12px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
.fp-table th[data-s]::after{content:attr(data-s);margin-left:4px;font-size:9px}
.fp-table td{padding:9px 12px;border-bottom:1px solid #eee;white-space:nowrap}
.fp-table tbody tr:hover td{background:#f7fafd}
.fp-r{text-align:right!important;font-variant-numeric:tabular-nums}
.fp-chip{display:inline-block;padding:2px 8px;border-radius:3px;font:700 11.5px "Open Sans"}
.fp-ok{background:#e3f4ea;color:#127a46}.fp-warn{background:#fff3d6;color:#8a5a00}.fp-bad{background:#fde4e6;color:#b0132a}.fp-info{background:#e8f1fc;color:#1f6fd1}
.fp-barcell{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.fp-track{width:100px;height:6px;border-radius:3px;background:#eee;overflow:hidden}
.fp-track i{display:block;height:100%;background:var(--accent)}
.fp-empty{padding:30px;text-align:center;color:var(--muted)}
.fp-json{margin:0;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;background:#fafafa;border:1px solid var(--line);padding:14px}
.fp-error{padding:12px 14px;border-left:4px solid var(--red);background:#fde4e6;white-space:pre-wrap}
.fp-error b{display:block;font:700 13px "Open Sans";color:#b0132a}
.fp-note{font:12.5px ui-monospace,Menlo,monospace;color:var(--muted)}
.fp-loading{display:flex;justify-content:center;align-items:center;gap:8px;padding:40px;color:var(--muted)}
.fp-loading i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ld 1s ease-in-out infinite}
.fp-loading i:nth-child(2){animation-delay:.15s}.fp-loading i:nth-child(3){animation-delay:.3s}
.fp-loading span{margin-left:6px}
@keyframes ld{50%{opacity:.2}}
#toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:60;padding:12px 18px;border-radius:4px;background:var(--nav);color:#fff;font:600 13.5px "Open Sans";box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none}
#toast.on{opacity:1;transform:none}
@media (max-width:900px){
  #app{grid-template-columns:64px 1fr}
  .inst b,.inst small,.me b,.it span.lbl,.out span{display:none}
  .inst,.me{justify-content:center;padding:0}.me{padding:12px 0}
  .it{padding:12px 0;justify-content:center}.it .n{display:none}
  .pg{padding:20px 16px}
  .layer{left:0}
  .lbody{grid-template-columns:1fr}.da{display:none}
  .main{padding:16px}
  .cal{grid-template-columns:1fr}
  .pbody.ent{grid-template-columns:1fr;overflow-y:auto}
  .grade{margin:0 16px 16px}
  .ci .r .vis{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside class="nav">
    <div class="inst"><div class="lg"><svg viewBox="0 0 24 24" width="22"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="#fff"/></svg></div><div><b>FARMACAMPUS</b><small>ITBA · Bases de Datos II</small></div></div>
    <div class="me"><div class="av">G10</div><b>Grupo 10</b></div>
    <button class="it" data-p="inst"><svg viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12z"/></svg><span class="lbl">Institución</span></button>
    <button class="it on" data-p="stream"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="lbl">Flujo de actividad</span><span class="n" id="nstream"></span></button>
    <button class="it" data-p="courses"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg><span class="lbl">Cursos</span></button>
