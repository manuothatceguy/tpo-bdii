<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Farma Hit &amp; Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="core.js"></script>
<style>
:root{--ink:#1a1a22;--cream:#fff8e8;--orange:#ff8a1f;--green:#2fbf5a;--blue:#2b7bff;--red:#ff4757;--sky:#7fd0ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd0ff;color:var(--ink);font:700 15px/1.35 Nunito,system-ui,sans-serif;user-select:none}
button,input,select{font:inherit;color:inherit}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.toon{background:var(--cream);border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink)}
.lg{font-family:"Luckiest Guy",Nunito,sans-serif;letter-spacing:.02em}
.stroke{color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}

#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s}
#title.out{opacity:0;pointer-events:none}
.logo{text-align:center;transform:rotate(-4deg);animation:logo 1s cubic-bezier(.2,1.8,.4,1) both}
@keyframes logo{from{transform:rotate(-20deg) scale(.2);opacity:0}}
.logo .a{display:block;font:400 clamp(44px,8vw,104px)/.9 "Luckiest Guy";color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:7px 7px 0 var(--ink)}
.logo .b{display:inline-block;margin-top:6px;padding:4px 20px;background:var(--orange);border:5px solid var(--ink);border-radius:16px;font:400 clamp(40px,7vw,88px)/1 "Luckiest Guy";color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;box-shadow:7px 7px 0 var(--ink);transform:rotate(3deg)}
.tag{font:900 18px Nunito;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px;box-shadow:4px 4px 0 var(--ink);animation:logo .8s .4s cubic-bezier(.2,1.8,.4,1) both}
.go{font:400 30px "Luckiest Guy";padding:14px 34px;background:var(--green);color:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);cursor:pointer;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;animation:pulse 1.2s ease-in-out infinite}
.go:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
@keyframes pulse{50%{transform:scale(1.06)}}
.ctrl{font:800 13px Nunito;background:rgba(255,255,255,.85);border:3px solid var(--ink);border-radius:14px;padding:8px 14px;text-align:center}
.ctrl kbd{display:inline-block;min-width:24px;padding:1px 6px;margin:0 2px;border:2px solid var(--ink);border-radius:6px;background:#fff;font:900 12px Nunito}
.topbtns{position:fixed;top:14px;right:14px;z-index:55;display:flex;gap:8px}
.tbtn{height:38px;padding:0 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);font:900 13px Nunito;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
select.tbtn{appearance:none;-webkit-appearance:none}

#hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
.coins{position:absolute;left:18px;top:16px;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 8px}
.coins svg{width:40px;height:40px}
.coins b{font:400 34px/1 "Luckiest Guy";color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
.coins b.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.4)}}
.api{position:absolute;left:18px;top:80px;display:flex;align-items:center;gap:8px;padding:4px 12px;font:900 12px Nunito}
.api i{width:10px;height:10px;border-radius:50%;background:#aaa;border:2px solid var(--ink)}
.api i.ok{background:var(--green)}.api i.bad{background:var(--red)}
.timer{position:absolute;left:50%;top:14px;translate:-50% 0;padding:4px 22px;font:400 44px/1.1 "Luckiest Guy";color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);display:none}
.timer.on{display:block}
.timer.low{color:var(--red);animation:pulse .5s ease-in-out infinite}
.obj{position:absolute;left:50%;top:84px;translate:-50% 0;padding:8px 18px;font:900 16px Nunito;display:none;white-space:nowrap}
.obj.on{display:block}
.obj b{color:var(--orange)}
#mini{position:absolute;right:18px;top:70px;width:200px;height:200px;border-radius:50%;border:5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:#8fd47a}
.speed{position:absolute;right:22px;bottom:20px;text-align:right}
.speed b{display:block;font:400 64px/1 "Luckiest Guy";color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.speed small{font:900 14px Nunito;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 10px}
.dlg{position:absolute;left:18px;bottom:18px;display:flex;align-items:flex-end;gap:10px;max-width:min(620px,calc(100vw - 220px));opacity:0;transform:translateY(20px);transition:all .35s cubic-bezier(.2,1.5,.4,1)}
.dlg.on{opacity:1;transform:none}
.dlg svg{width:110px;height:110px;flex:none;filter:drop-shadow(4px 4px 0 var(--ink))}
.dlg .bub{position:relative;padding:12px 16px;font:800 16px/1.35 Nunito}
.dlg .bub b{display:block;font:400 20px "Luckiest Guy";color:var(--orange);-webkit-text-stroke:1px var(--ink)}
.toast{position:absolute;left:50%;top:38%;translate:-50% -50%;font:400 clamp(48px,8vw,96px)/1 "Luckiest Guy";color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);opacity:0;white-space:nowrap;pointer-events:none}
.toast.on{animation:toast 1.6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes toast{0%{opacity:0;transform:scale(.3) rotate(-10deg)}20%{opacity:1;transform:scale(1.1) rotate(-3deg)}35%{transform:scale(1) rotate(-3deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-30px) rotate(-3deg)}}

.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(26,26,34,.35)}
.ov.on{display:flex}
.card{width:min(560px,100%);padding:20px 22px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.card.prep{width:min(760px,100%);max-height:min(90vh,820px);display:flex;flex-direction:column;padding:0;overflow:hidden}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.card h2{margin:0 0 2px;font:400 36px/1 "Luckiest Guy";color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.card .sub{margin-bottom:12px;font:800 14px Nunito;color:#5a5a66}
.mis{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;padding:10px 12px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .1s}
.mis:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:#fffbe0}
.mis .c{flex:none;width:52px;height:52px;border-radius:12px;border:3px solid var(--ink);display:grid;place-items:center;font:400 18px "Luckiest Guy";color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;background:var(--mc)}
.mis .n{flex:1;font:900 16px/1.2 Nunito}
.mis .n small{display:block;font:700 12.5px Nunito;color:#666}
.legs{display:flex;gap:4px}
.legs i{font-style:normal;font:900 11px Nunito;padding:2px 7px;border:2px solid var(--ink);border-radius:999px;color:#fff}
.legs .m{background:var(--green)}.legs .r{background:var(--red)}
.btnrow{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.btn{height:44px;padding:0 18px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:4px 4px 0 var(--ink);font:900 15px Nunito;cursor:pointer}
.btn.pri{background:var(--green);color:#fff;-webkit-text-stroke:.5px var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}

.res{width:min(1100px,100%);height:min(88vh,860px);display:flex;flex-direction:column;padding:0;overflow:hidden;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.rhead{position:relative;padding:16px 22px;background:var(--rc,#2fbf5a);border-bottom:4px solid var(--ink);display:flex;align-items:center;gap:16px}
.rhead h2{margin:0;flex:1;font:400 clamp(28px,4vw,46px)/1 "Luckiest Guy";color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.rhead .bonus{font:400 26px "Luckiest Guy";color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;background:var(--orange);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;transform:rotate(3deg)}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--cream);overflow:auto}

.fp{display:flex;flex-direction:column;flex:1;min-height:0}
.fp-head{display:flex;align-items:center;gap:12px;padding:14px 20px 6px}
.fp-code{padding:4px 10px;border:3px solid var(--ink);border-radius:10px;background:var(--qc);font:400 20px "Luckiest Guy";color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.fp-titles{flex:1;min-width:0}
.fp-cat{font:900 11px Nunito;letter-spacing:.1em;text-transform:uppercase;color:#777}
.fp-title{margin:0;font:900 20px Nunito}
.fp-ep{font:700 12.5px ui-monospace,Menlo,monospace;color:var(--blue);word-break:break-all}
.fp-actions:empty{display:none}
.fp-form{display:flex;flex-wrap:wrap;gap:10px 12px;padding:6px 20px 2px;align-items:flex-end}
.fp-modes{display:flex;gap:6px;width:100%}
.fp-modes button{flex:1;height:40px;border:3px solid var(--ink);border-radius:12px;background:#fff;font:900 14px Nunito;cursor:pointer}
.fp-modes button.on{background:var(--blue);color:#fff}
.fp-field{display:flex;flex-direction:column;gap:3px;font:900 12px Nunito;text-transform:uppercase;color:#555}
.fp-field[hidden]{display:none}
.fp-field.fp-wide{width:100%}
.fp-field input,.fp-field select{height:40px;min-width:140px;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:0 10px;font:700 15px Nunito;text-transform:none;outline:none}
.fp-field input:focus,.fp-field select:focus{background:#fffbe0}
.fp-items{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fp-item{display:flex;gap:6px;align-items:center}
.fp-item .fp-ip{width:140px;min-width:0}.fp-item .fp-ic{width:70px;min-width:0}
.fp-btn{height:40px;padding:0 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);font:900 14px Nunito;cursor:pointer}
.fp-btn.fp-sm{height:32px;font-size:12.5px}
.fp-run{background:var(--green);color:#fff;min-width:150px}
.fp-run:disabled{opacity:.6;cursor:wait}
.fp-bar{display:flex;gap:10px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.fp-seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.fp-seg button{border:0;background:#fff;padding:6px 12px;font:900 13px Nunito;cursor:pointer}
.fp-seg button.on{background:var(--ink);color:#fff}
.fp-stat{margin-left:auto;font:800 13px Nunito;color:#555}
.fp-stat b{color:var(--green)}
.fp-out{flex:1;min-height:0;overflow:auto;padding:0 20px 20px}
.fp-sec{margin-bottom:14px}
.fp-sec h4{margin:0 0 6px;font:400 20px "Luckiest Guy";color:var(--orange);-webkit-text-stroke:1px var(--ink)}
.fp-tablewrap{border:3px solid var(--ink);border-radius:14px;overflow:auto;background:#fff}
.fp-table{border-collapse:collapse;width:100%;font:700 14px Nunito}
.fp-table th{position:sticky;top:0;background:#ffe9b8;text-align:left;font:900 12px Nunito;text-transform:uppercase;padding:9px 12px;border-bottom:3px solid var(--ink);cursor:pointer;white-space:nowrap}
.fp-table th[data-s]::after{content:attr(data-s);margin-left:4px;font-size:9px}
.fp-table td{padding:8px 12px;border-top:2px dashed #e6dcc6;white-space:nowrap}
.fp-table tbody tr{animation:rin .35s cubic-bezier(.2,1.5,.4,1) both}
.fp-table tbody tr:hover td{background:#fffbe0}
@keyframes rin{from{opacity:0;transform:translateX(-14px)}}
.fp-r{text-align:right!important;font-variant-numeric:tabular-nums}
.fp-chip{display:inline-block;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;font:900 11.5px Nunito;color:#fff}
.fp-ok{background:var(--green)}.fp-warn{background:var(--orange)}.fp-bad{background:var(--red)}.fp-info{background:var(--blue)}
.fp-barcell{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.fp-track{width:110px;height:12px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
.fp-track i{display:block;height:100%;background:var(--orange)}
.fp-empty{padding:30px;text-align:center;font:900 16px Nunito;color:#777}
.fp-json{margin:0;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px}
.fp-error{padding:14px;border:3px solid var(--ink);border-radius:14px;background:#ffd6da;white-space:pre-wrap}
.fp-error b{display:block;font:400 20px "Luckiest Guy";color:var(--red);-webkit-text-stroke:1px var(--ink)}
.fp-note{font:700 12.5px ui-monospace,Menlo,monospace;color:#777}
.fp-loading{display:flex;justify-content:center;align-items:center;gap:8px;padding:40px;font:400 22px "Luckiest Guy"}
.fp-loading i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--orange);animation:bounce .7s ease-in-out infinite}
.fp-loading i:nth-child(2){animation-delay:.1s;background:var(--green)}.fp-loading i:nth-child(3){animation-delay:.2s;background:var(--blue)}
.fp-loading span{margin-left:8px}
@keyframes bounce{50%{transform:translateY(-12px)}}

.touch{position:fixed;bottom:16px;z-index:30;display:none;gap:10px}
.touch button{width:64px;height:64px;border:4px solid var(--ink);border-radius:18px;background:rgba(255,255,255,.85);box-shadow:4px 4px 0 var(--ink);font:400 26px "Luckiest Guy";touch-action:none}
@media (pointer:coarse){.touch{display:flex}}
@media (max-width:760px){
  #mini{width:130px;height:130px;top:66px;right:12px}
  .speed b{font-size:44px}
  .dlg{bottom:96px;max-width:calc(100vw - 30px)}.dlg svg{width:70px;height:70px}
  .timer{font-size:34px}
  .obj{font-size:13px;top:70px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="title">
  <div class="logo"><span class="a">FARMA</span><span class="b">HIT &amp; RUN</span></div>
  <div class="tag">Un barrio. Quince consultas. Una camioneta.</div>
  <button class="go" id="go">¡A manejar!</button>
  <div class="ctrl"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o flechas: manejar · <kbd>Espacio</kbd> freno de mano · <kbd>R</kbd> enderezar · entrá a un círculo de color para ver sus misiones</div>
</div>
<div class="topbtns"><span class="tbtn" id="mute"></span><a class="tbtn" id="docs" target="_blank" rel="noopener">API</a><span id="themes"></span></div>

<div id="hud">
  <div class="coins toon"><svg viewBox="0 0 40 40"><g transform="rotate(-35 20 20)"><rect x="4" y="13" width="32" height="14" rx="7" fill="#fff" stroke="#1a1a22" stroke-width="3"/><path d="M4 20a7 7 0 0 1 7-7h9v14h-9a7 7 0 0 1-7-7z" fill="#ff4757" stroke="#1a1a22" stroke-width="3"/></g></svg><b id="coins">0</b></div>
  <div class="api toon"><i id="apidot"></i><span id="apitxt">API</span></div>
  <div class="timer" id="timer">0:30</div>
  <div class="obj toon" id="obj"></div>
  <canvas id="mini" width="400" height="400"></canvas>
  <div class="speed"><b id="spd">0</b><small>KM/H</small></div>
  <div class="dlg" id="dlg">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#ffe9b8" stroke="#1a1a22" stroke-width="5"/><path d="M28 112c4-22 16-30 32-30s28 8 32 30" fill="#fff" stroke="#1a1a22" stroke-width="5"/><path d="M52 84l8 10 8-10" fill="#2fbf5a" stroke="#1a1a22" stroke-width="3"/><ellipse cx="60" cy="56" rx="24" ry="27" fill="#f1b892" stroke="#1a1a22" stroke-width="5"/><path d="M36 48c0-18 10-26 24-26s25 8 25 24c-8-6-14-9-25-9-9 0-16 4-24 11z" fill="#6b3d22" stroke="#1a1a22" stroke-width="4"/><circle cx="50" cy="58" r="8" fill="#fff" stroke="#1a1a22" stroke-width="4"/><circle cx="71" cy="58" r="8" fill="#fff" stroke="#1a1a22" stroke-width="4"/><path d="M58 58h5" stroke="#1a1a22" stroke-width="4"/><circle cx="51" cy="59" r="3" fill="#1a1a22"/><circle cx="72" cy="59" r="3" fill="#1a1a22"/><path d="M52 72q8 7 16 0" fill="none" stroke="#1a1a22" stroke-width="4" stroke-linecap="round"/><rect x="72" y="88" width="14" height="14" rx="3" fill="#2fbf5a" stroke="#1a1a22" stroke-width="3"/><path d="M79 91v8M75 95h8" stroke="#fff" stroke-width="3"/></svg>
    <div class="bub toon"><b>Fermín</b><span id="dlgt"></span></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<div class="ov" id="sel"><div class="card toon" id="selc"></div></div>
<div class="ov" id="resov"><div class="res toon" id="res"></div></div>
<div class="touch" style="left:16px"><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="touch" style="right:16px"><button data-k="back">▼</button><button data-k="gas">▲</button></div>

<script>
(() => {
"use strict";
const F = window.Farma, { el, FMT } = F;
const $ = id => document.getElementById(id);
if (!window.THREE) { document.body.innerHTML = '<div style="padding:40px;font:700 18px Nunito">No se pudo cargar Three.js desde el CDN. Farma Hit &amp; Run necesita internet para la librería 3D.</div>'; return; }

const BRIEF = {
  Q01: "Necesito el catálogo completo con cada proveedor. ¡Andá al Archivo y traelo!",
  Q02: "Hay ventas colgadas. Averiguá en el Archivo quién las dejó pendientes.",
  Q03: "Un cliente pidió su historial. Buscá ventas y recetas en el Archivo.",
  Q04: "¿Quiénes juntan más de una receta? El Archivo sabe.",
  Q05: "¿Quién vendió en los últimos 60 días? Traeme el ranking.",
  Q06: "Hay tratamientos con la dispensa vencida. ¡Rápido, al Archivo!",
  Q07: "¿Qué es lo que más se vende? Traeme el top 5.",
  Q08: "El Depósito está flojo. Contá los lotes en Redis y después cruzalos en el Archivo.",
  Q09: "Las ventas chicas sin receta, de menos de cinco lucas.",
  Q10: "¿Quiénes compran en esta sucursal? Buscalo en el Archivo.",
  Q11: "Hay que hacer la caja del mes de cada farmacéutico.",
  Q12: "Hay clientes que no aparecen hace un año. Encontralos.",
  Q13: "Hay que dar de alta, cambiar o dar de baja a un cliente en el Archivo.",
  Q14: "¡Venta nueva! Primero descontá el stock en el Depósito y después registrala en el Archivo.",
  Q15: "Buscá la venta en el Archivo y después descontá el stock en el Depósito, primero lo que vence antes.",
};
const LEGS = { Q08: ["redis", "mongo"], Q14: ["redis", "mongo"], Q15: ["mongo", "redis"] };
const legsOf = q => LEGS[q.code] || ["mongo"];

const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const sky = document.createElement("canvas"); sky.width = 2; sky.height = 256;
{ const g = sky.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, "#3fa9ff"); gr.addColorStop(.6, "#9fdcff"); gr.addColorStop(1, "#e6f7ff"); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); }
scene.background = new THREE.CanvasTexture(sky);
scene.fog = new THREE.Fog(0xbfe8ff, 150, 330);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .5, 900);
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa66, .75));
const sun = new THREE.DirectionalLight(0xfff2d6, .85);
sun.position.set(60, 120, 40);

  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => { keys[k] = false; });
});

const engine = { osc: null, gain: null, f: null };
function engineOn() {
  const a = F.Sound.get(); if (!a || engine.osc) return;
  engine.osc = a.createOscillator(); engine.osc.type = "sawtooth";
  engine.f = a.createBiquadFilter(); engine.f.type = "lowpass"; engine.f.frequency.value = 500;
  engine.gain = a.createGain(); engine.gain.gain.value = 0;
  engine.osc.connect(engine.f).connect(engine.gain).connect(a.destination); engine.osc.start();
}
function engineSet(v) {
  if (!engine.osc) return;
  const a = F.Sound.ctx, sp = Math.abs(v);
  engine.osc.frequency.setTargetAtTime(48 + sp * 3.2, a.currentTime, .05);
  engine.gain.gain.setTargetAtTime(F.Sound.muted || state !== "drive" ? 0 : .025 + Math.min(sp, 40) * .0009, a.currentTime, .1);
}

let state = "title", coinsN = 0, mission = null, cooldown = 0, dlgT, toastT;
function say(text, ms = 5200) { $("dlgt").textContent = text; $("dlg").classList.add("on"); clearTimeout(dlgT); dlgT = setTimeout(() => $("dlg").classList.remove("on"), ms); }
function toast(text, color = "#fff") { const t = $("toast"); t.textContent = text; t.style.color = color; t.classList.remove("on"); void t.offsetWidth; t.classList.add("on"); }
function paintCoins(b) { const c = $("coins"); c.textContent = coinsN; if (b) { c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); } }

function sampleQ13(mode = "Alta") {
  if (mode === "Modificar") {
    return { modo: "Modificar", id_cliente: "C001", nombre: "", apellido: "", dni: "", email: "", telefono: "11-4444-9000", ciudad: "", provincia: "", obra_social: "", nro_afiliado: "" };
  }
  if (mode === "Baja") {
    return { modo: "Baja", id_cliente: "C005", nombre: "", apellido: "", dni: "", email: "", telefono: "", ciudad: "", provincia: "", obra_social: "", nro_afiliado: "" };
  }
  const n = Math.floor(1000 + Math.random() * 9000);
  return {
    modo: "Alta",
    id_cliente: "",
    nombre: "Lucía",
    apellido: "Gómez",
    dni: String(30000000 + Math.floor(Math.random() * 15000000)),
    email: `lucia.gomez.${n}@mail.com`,
    telefono: `11-5555-${n}`,
    ciudad: "Buenos Aires",
    provincia: "Buenos Aires",
    obra_social: "OSDE",
    nro_afiliado: `OS-${n}`,
  };
}

function openSelect(stationId) {
  state = "select";
  const st = F.STATIONS.find(s => s.id === stationId), d = STATION_DEF[stationId];
  const hex = "#" + new THREE.Color(d.color).getHexString();
  const card = $("selc");
  card.className = "card toon";
  card.replaceChildren(
    el("h2", { text: st.title, style: `color:${hex}` }), el("div", { class: "sub", text: `${st.sub} · elegí una misión` }),
    ...st.queries.map(code => {
      const q = F.byCode(code), legs = legsOf(q), needsInput = !!(q.fields && q.fields.length);
      return el("button", { class: "mis", style: `--mc:${q.color}`, onclick: () => (needsInput ? openPrep(stationId, q) : startMission(q)) },
        el("div", { class: "c", text: code.slice(1) }),
        el("div", { class: "n" }, q.short, el("small", { text: `${q.mutation ? "Golpe: modifica datos" : "Reconocimiento: solo lee"}${needsInput ? " · pide datos antes de salir" : ""}` })),
        el("div", { class: "legs" }, legs.map(l => el("i", { class: l === "mongo" ? "m" : "r", text: l === "mongo" ? "MONGO" : "REDIS" }))));
    }),
    el("div", { class: "btnrow" }, el("button", { class: "btn", text: "Seguir manejando (Esc)", onclick: closeOverlays })));
  $("sel").classList.add("on");
  F.Sound.tone(660, 0, .08, "square", .03); F.Sound.tone(990, .06, .1, "square", .03);
}

function openPrep(stationId, q) {
  state = "select";
  const legs = legsOf(q);
  const card = $("selc");
  card.className = "card toon prep";
  card.style.setProperty("--rc", q.color);
  const initialValues = q.code === "Q13" ? sampleQ13("Alta") : undefined;
  const panel = F.createPanel(q, {
    initialValues,
    modeRun: { Alta: "¡Salir a dar de alta!", Modificar: "¡Salir a guardar cambios!", Baja: "¡Salir a dar de baja!" },
    text: {
      run: "¡Salir a consultar!",
      runMutation: "¡Salir a ejecutar golpe!",
      fill: "Revisá o completá los datos del pedido antes de salir manejando.",
      invalid: "Revisá los datos antes de salir",
    },
    onMode: m => { if (q.code === "Q13") panel.setValues(sampleQ13(m)); },
    onSubmit: vals => startMission(q, vals),
    onError: e => {
      toast("¡FALTAN DATOS!", "#ff4757");
      say(e.message.split("\n")[0], 5000);
      F.Sound.tone(220, 0, .25, "sawtooth", .05);
    },
  });
  if (q.code === "Q13") {
    panel.actions.append(el("button", { class: "fp-btn fp-sm", type: "button", text: "Completar ejemplo", onclick: () => panel.setValues(sampleQ13(panel.values().modo)) }));
  }
  panel.bar.append(el("button", { class: "fp-btn", type: "button", text: "Cancelar (Esc)", onclick: closeOverlays }));
  card.replaceChildren(
    el("div", { class: "rhead" },
      el("h2", { text: "Preparar pedido" }),
      el("div", { class: "legs" }, legs.map(l => el("i", { class: l === "mongo" ? "m" : "r", text: l === "mongo" ? "MONGO" : "REDIS" }))),
      el("button", { class: "btn", text: "← Volver", onclick: () => openSelect(stationId) })),
    el("div", { class: "rbody" }, panel.root));
  $("sel").classList.add("on");
  say(`Completá los datos de ${q.code} antes de salir con la camioneta.`, 5500);
  F.Sound.tone(740, 0, .08, "square", .03);
  setTimeout(() => panel.focus(), 100);
}

function startMission(q, preset = null) {
  $("sel").classList.remove("on");
  const legs = legsOf(q);
  mission = { q, legs, leg: 0, time: 30 + legs.length * 12, preset };
  setTarget();
  state = "drive";
  $("timer").classList.add("on");
  say(BRIEF[q.code], 6500);
  toast("¡MISIÓN!", "#ffd23f");
  F.Sound.tone(523, 0, .15, "square", .04); F.Sound.tone(784, .12, .25, "square", .04);
}
function setTarget() {
  const eng = mission.legs[mission.leg];
  target.pos.copy(ENGINE_POS[eng]); target.g.position.copy(ENGINE_POS[eng]); target.g.visible = true;
  target.beam.material.color.setHex(eng === "mongo" ? 0x2fbf5a : 0xff4757);
  target.ring.material.color.setHex(eng === "mongo" ? 0x2fbf5a : 0xff4757);
  arrow.visible = true;
  $("obj").replaceChildren(`Llevá el pedido ${mission.q.code} al `, el("b", { text: ENGINE_NAME[eng] }), mission.legs.length > 1 ? ` · tramo ${mission.leg + 1}/${mission.legs.length}` : "");
  $("obj").classList.add("on");
}
function arrive() {
  if (mission.leg < mission.legs.length - 1) {
    mission.leg++; mission.time += 8;
    setTarget();
    toast("¡BIEN!", "#2fbf5a");
    say(mission.q.code === "Q08" ? "¡Ya conté los lotes en Redis! Ahora cruzalos en el Archivo MongoDB." : mission.legs[mission.leg] === "mongo" ? "¡Listo el stock! Ahora registralo en el Archivo MongoDB." : "¡Encontré la venta! Ahora al Depósito Redis a descontar.", 4500);
    F.Sound.tone(880, 0, .1, "square", .04); F.Sound.tone(1320, .08, .15, "square", .04);
    return;
  }
  const { q, preset } = mission, bonus = Math.max(1, Math.ceil(mission.time));
  endMission();
  showResult(q, bonus, preset);
}
function endMission() { mission = null; target.g.visible = false; arrow.visible = false; $("timer").classList.remove("on", "low"); $("obj").classList.remove("on"); }
function failMission() {
  const q = mission.q;
  endMission();
  toast("¡SE TE PASÓ!", "#ff4757");
  say(`Llegaste tarde con ${q.code}. Volvé a la estación para reintentar.`, 4500);
  F.Sound.tone(300, 0, .3, "sawtooth", .05, 120);
}
function showResult(q, bonus, preset = null) {
  state = "result";
  let rewarded = false;
  const headTitle = el("h2", { text: "¡Misión cumplida!" });
  const bonusBadge = el("span", { class: "bonus", text: `+${bonus}` });
  const panel = F.createPanel(q, {
    initialValues: preset || undefined,
    autorun: true,
    autorunDelay: 350,
    text: { run: "Volver a consultar", runMutation: "¡Ejecutar golpe!", loading: "Entregando", empty: "No había nada", fill: "Completá el pedido y ejecutá el golpe", invalid: "Faltan datos" },
    onSuccess: (q, req, res, msg) => {
      headTitle.textContent = "¡Misión cumplida!";
      $("res").style.setProperty("--rc", q.color);
      if (!rewarded) {
        rewarded = true;
        coinsN += bonus; paintCoins(true);
      }
      if (msg) {
        toast("¡GOLPE PERFECTO!", "#2fbf5a");
        say(msg, 5000);
        F.Sound.tone(523, 0, .2, "square", .04); F.Sound.tone(659, .1, .2, "square", .04); F.Sound.tone(784, .2, .35, "square", .04);
        refresh();
      } else {
        toast("¡MISIÓN CUMPLIDA!", "#ffd23f");
        [523, 659, 784, 1047].forEach((f, i) => F.Sound.tone(f, i * .1, .3, "square", .035));
      }
    },
    onError: e => {
      headTitle.textContent = "¡No se pudo completar!";
      $("res").style.setProperty("--rc", "#ff4757");
      toast("¡UPS!", "#ff4757");
      say(`El servidor dijo: ${e.message.split("\n")[0]}`, 6000);
      F.Sound.tone(220, 0, .3, "sawtooth", .05);
    },
  });
  $("res").style.setProperty("--rc", q.color);
  $("res").replaceChildren(
    el("div", { class: "rhead" }, headTitle, bonusBadge, el("button", { class: "btn", text: "Seguir (Esc)", onclick: closeOverlays })),
    el("div", { class: "rbody" }, panel.root));
  $("resov").classList.add("on");
}
function closeOverlays() {
  if (state === "select" || state === "result") {
    $("sel").classList.remove("on"); $("resov").classList.remove("on");
    state = "drive"; cooldown = 1.8;
    document.activeElement?.blur();
  }
}

const mini = $("mini"), mx = mini.getContext("2d");
function drawMini() {
  const W = mini.width, S = 1.5;
  mx.save(); mx.clearRect(0, 0, W, W);
  mx.beginPath(); mx.arc(W / 2, W / 2, W / 2, 0, 7); mx.clip();
  mx.fillStyle = "#8fd47a"; mx.fillRect(0, 0, W, W);
  mx.translate(W / 2, W / 2); mx.rotate(P.h - Math.PI); mx.scale(S, S); mx.translate(-P.x, -P.z);
  mx.fillStyle = "#5c6170";
  for (const r of ROADS) { mx.fillRect(r - RW / 2, -EXT - 6, RW, EXT * 2 + 12); mx.fillRect(-EXT - 6, r - RW / 2, EXT * 2 + 12, RW); }
  mx.fillStyle = "#e9dfc9";
  for (const c of colliders) if (c.x1 - c.x0 > 5) mx.fillRect(c.x0, c.z0, c.x1 - c.x0, c.z1 - c.z0);
  for (const id in markers) {
    const m = markers[id]; if (!m.g.visible) continue;
    mx.fillStyle = "#" + (id === "target" ? m.beam.material.color.getHexString() : new THREE.Color(m.color).getHexString());
    mx.strokeStyle = "#1a1a22"; mx.lineWidth = 2;
    mx.beginPath(); mx.arc(m.pos.x, m.pos.z, id === "target" ? 7 + Math.sin(performance.now() / 150) * 2 : 5, 0, 7); mx.fill(); mx.stroke();
  }
  mx.fillStyle = "#ffd23f";
  for (const c of coins) if (!c.taken) { mx.beginPath(); mx.arc(c.g.position.x, c.g.position.z, 1.4, 0, 7); mx.fill(); }
  mx.restore();
  mx.save(); mx.translate(W / 2, W / 2);
  mx.fillStyle = "#fff"; mx.strokeStyle = "#1a1a22"; mx.lineWidth = 4;
  mx.beginPath(); mx.moveTo(0, -16); mx.lineTo(12, 12); mx.lineTo(0, 6); mx.lineTo(-12, 12); mx.closePath(); mx.fill(); mx.stroke();
  mx.restore();
}

function collide(x, z) {
  const r = 2.2;
  if (Math.abs(x) > EXT + 4 || Math.abs(z) > EXT + 4) return true;
  for (const c of colliders) if (x + r > c.x0 && x - r < c.x1 && z + r > c.z0 && z - r < c.z1) return true;
  return false;
}
let bumpT = 0;
function physics(dt) {
  const gas = keys.KeyW || keys.ArrowUp, brk = keys.KeyS || keys.ArrowDown, left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight, hb = keys.Space;
  const MAX = 40;
  if (gas) P.v += (P.v < 0 ? 60 : 26) * dt;
  else if (brk) P.v -= (P.v > 0 ? 50 : 18) * dt;
  else P.v -= Math.sign(P.v) * Math.min(Math.abs(P.v), 9 * dt);
  if (hb) P.v -= Math.sign(P.v) * Math.min(Math.abs(P.v), 22 * dt);
  P.v = Math.max(-14, Math.min(MAX, P.v));
  const steerTarget = (left ? 1 : 0) - (right ? 1 : 0);
  P.steer += (steerTarget - P.steer) * Math.min(1, dt * 8);
  const turn = P.steer * Math.min(1, Math.abs(P.v) / 8) * (hb ? 3.4 : 2.2) * Math.sign(P.v || 1);
  P.h += turn * dt;
  const nx = P.x + Math.sin(P.h) * P.v * dt, nz = P.z + Math.cos(P.h) * P.v * dt;
  if (!collide(nx, nz)) { P.x = nx; P.z = nz; }
  else if (!collide(nx, P.z)) { P.x = nx; P.v *= .9; }
  else if (!collide(P.x, nz)) { P.z = nz; P.v *= .9; }
  else { if (Math.abs(P.v) > 12 && bumpT <= 0) { F.Sound.noise(0, .2, .1, 400); bumpT = .4; } P.v *= -.3; }
  bumpT -= dt;
  P.yv -= 40 * dt; P.y = Math.max(0, P.y + P.yv * dt); if (P.y === 0) P.yv = 0;
  car.g.position.set(P.x, P.y, P.z);
  car.g.rotation.y = P.h;
  car.body.rotation.z = -P.steer * Math.min(1, Math.abs(P.v) / 30) * .12;
  car.body.rotation.x = (gas ? -.03 : brk ? .04 : 0) * Math.min(1, Math.abs(P.v) / 10);
  car.wheels.forEach((w, i) => { w.children[0].rotation.x += P.v * dt / .85; if (i < 2) w.rotation.y = P.steer * .45; });
}

const clock = new THREE.Clock();
let camPos = new THREE.Vector3(60, 60, 60), camLook = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (state === "drive") physics(dt);
  engineSet(state === "drive" ? P.v : 0);
  for (const n of npcs) { n.s += n.sp * dt; const [x, z, ry] = loopPos(n.loop, n.s); n.g.position.set(x, 0, z); n.g.rotation.y = ry; }
  for (const c of clouds) c.position.x = ((c.position.x + dt * 2 + 260) % 520) - 260;
  for (const id in markers) { const m = markers[id]; m.icon.position.y = 9 + Math.sin(t * 3 + m.pos.x) * .6; m.beam.material.opacity = .25 + Math.sin(t * 4) * .08; m.ring.rotation.z = t; }
  car.beacon.material.color.setHex(Math.sin(t * 10) > 0 ? 0xff8a1f : 0xffd23f);
  if (signs.caja.userData.cross) signs.caja.userData.cross.rotation.y = t * 1.5;
  for (const c of coins) {
    if (c.taken) { if (c.t < 1) { c.t += dt * 3; c.g.position.y = 2 + c.t * 4; c.g.scale.setScalar(Math.max(.01, 1 - c.t)); if (c.t >= 1) c.g.visible = false; } continue; }
    c.g.rotation.y = t * 3; c.g.position.y = 2 + Math.sin(t * 2 + c.g.position.x) * .3;
    if (state === "drive" && (c.g.position.x - P.x) ** 2 + (c.g.position.z - P.z) ** 2 < 9) { c.taken = true; coinsN++; paintCoins(true); F.Sound.tone(1320, 0, .06, "square", .03); F.Sound.tone(1760, .05, .08, "square", .03); }
  }
  if (state === "drive") {
    cooldown -= dt;
    if (mission) {
      mission.time -= dt;
      const s = Math.max(0, mission.time);
      $("timer").textContent = `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
      $("timer").classList.toggle("low", s < 10);
      const d = Math.hypot(target.pos.x - P.x, target.pos.z - P.z);
      arrow.position.set(P.x, 7.5 + Math.sin(t * 4) * .3, P.z);
      arrow.rotation.y = Math.atan2(target.pos.x - P.x, target.pos.z - P.z);
      if (d < 6.5) arrive();
      else if (mission.time <= 0) failMission();
    } else if (cooldown <= 0) {
      for (const s of F.STATIONS) { const m = markers[s.id]; if (Math.hypot(m.pos.x - P.x, m.pos.z - P.z) < 6) { P.v = 0; openSelect(s.id); break; } }
    }
    $("spd").textContent = Math.round(Math.abs(P.v) * 3.6);
  }
  if (state === "title") {
    const a = t * .12;
    camPos.set(Math.sin(a) * 150, 72, Math.cos(a) * 150);
    camLook.set(0, 0, 0);
    camera.fov = 50;
  } else {
    const fx = Math.sin(P.h), fz = Math.cos(P.h);
    const want = new THREE.Vector3(P.x - fx * 15, P.y + 7.5, P.z - fz * 15);
    camPos.lerp(want, Math.min(1, dt * (state === "drive" ? 4 : 1.5)));
    camLook.lerp(new THREE.Vector3(P.x + fx * 5, P.y + 2, P.z + fz * 5), Math.min(1, dt * 6));
    camera.fov += ((62 + Math.abs(P.v) * .45) - camera.fov) * Math.min(1, dt * 3);
  }
  camera.updateProjectionMatrix();
  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera);
  if (state !== "title") drawMini();
  requestAnimationFrame(loop);
}

function start() {
  if (state !== "title") return;
  state = "drive";
  $("title").classList.add("out");
  $("hud").classList.add("on");
  engineOn();
  F.Sound.tone(392, 0, .15, "square", .04); F.Sound.tone(523, .12, .15, "square", .04); F.Sound.tone(784, .24, .3, "square", .04);
  say("¡Buen día! Soy Fermín, el farmacéutico. Entrá a un círculo de color para ver las misiones de cada lugar. ¡Y juntá las pastillas doradas!", 7000);
  toast("¡A MANEJAR!", "#ffd23f");
}
$("go").onclick = start;

async function refresh() {
  const ok = await F.ping();
  $("apidot").className = ok ? "ok" : "bad";
  $("apitxt").textContent = ok ? "API en línea" : "API sin conexión";
  if (ok) F.snapshot();
}
const paintMute = () => ($("mute").textContent = F.Sound.muted ? "Sonido: no" : "Sonido: sí");
paintMute();
$("mute").onclick = () => { F.Sound.toggle(); paintMute(); if (!F.Sound.muted) engineOn(); };
$("docs").href = F.API.base + "/docs";
$("themes").append(F.themeSwitcher("farmahitrun", "tbtn"));
refresh(); setInterval(refresh, 20000);
paintCoins();
loop();
})();
</script>
