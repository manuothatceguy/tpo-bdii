<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Farma of Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<script src="core.js"></script>
<style>
:root{
  --bg:#010a13;--bg2:#091428;--panel:#0a1428;--gold:#c8aa6e;--gold2:#f0e6d2;--gold3:#785a28;--goldd:#463714;
  --hex:#0ac8b9;--hex2:#0397ab;--hexd:#005a82;--text:#a09b8c;--text2:#f0e6d2;--red:#e84057;--line:#3c3c41;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 Lato,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.cz{font-family:Cinzel,Georgia,serif}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.bgart{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 70% 40%,rgba(10,200,185,.10),transparent 55%),radial-gradient(ellipse at 20% 80%,rgba(200,170,110,.08),transparent 50%),linear-gradient(180deg,#010a13,#06101f 60%,#010a13)}

#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000;transition:opacity 1s ease .2s,visibility 1.2s}
#intro.done{opacity:0;visibility:hidden}
.ic{position:relative;width:min(340px,70vw);aspect-ratio:1}
.ic svg{position:absolute;inset:0;width:100%;height:100%}
.ring{fill:none;stroke:url(#gg);stroke-width:2;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.2s cubic-bezier(.6,0,.2,1) forwards}
.ring.r2{stroke-width:1;animation-delay:.4s;opacity:.6}
.ring.r3{stroke:var(--hex);stroke-width:1.5;animation-delay:.8s;filter:drop-shadow(0 0 6px var(--hex))}
.runes{transform-origin:50% 50%;animation:spin 30s linear infinite;opacity:0;animation:spin 30s linear infinite,fade .8s 1.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{to{opacity:.7}}
.iemb{position:absolute;inset:28%;opacity:0;transform:scale(.4);animation:emb .9s cubic-bezier(.2,1.6,.4,1) 1.7s forwards;filter:drop-shadow(0 0 22px rgba(10,200,185,.7))}
@keyframes emb{to{opacity:1;transform:none}}
.iflash{position:absolute;inset:-60%;background:radial-gradient(circle,rgba(240,230,210,.95),rgba(10,200,185,.35) 25%,transparent 55%);opacity:0;animation:flash 1.1s ease-out 1.75s}
@keyframes flash{15%{opacity:1}100%{opacity:0}}
.ititle{position:absolute;left:50%;top:calc(100% + 26px);translate:-50% 0;white-space:nowrap;text-align:center}
.ititle h1{margin:0;font:900 clamp(26px,4.4vw,48px) Cinzel,serif;letter-spacing:.5em;padding-left:.5em;background:linear-gradient(180deg,#f0e6d2,#c8aa6e 60%,#785a28);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:tin 1.4s ease 2.2s forwards}
.ititle p{margin:10px 0 0;font:500 12px Cinzel,serif;letter-spacing:.6em;color:var(--hex);opacity:0;animation:tin 1.2s ease 2.8s forwards}
@keyframes tin{from{opacity:0;letter-spacing:1.2em;filter:blur(6px)}to{opacity:1}}
.iskip{position:fixed;bottom:22px;right:26px;font:500 11px Cinzel,serif;letter-spacing:.3em;color:#5b5a56;opacity:0;animation:fade .6s 1s forwards}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;opacity:0;transition:opacity .9s .1s}
#app.on{opacity:1}
nav.top{height:84px;display:flex;align-items:center;gap:18px;padding:0 22px;background:linear-gradient(180deg,rgba(1,10,19,.96),rgba(1,10,19,.85));border-bottom:1px solid var(--gold3);position:relative;transform:translateY(-100%);transition:transform .8s cubic-bezier(.2,.8,.2,1) .3s}
#app.on nav.top{transform:none}
nav.top::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:linear-gradient(90deg,transparent,var(--gold3) 20%,var(--gold) 50%,var(--gold3) 80%,transparent);opacity:.6}
.emb{width:54px;height:54px;flex:none}
.play{position:relative;height:46px;min-width:170px;padding:0 28px;border:0;cursor:pointer;font:700 17px Cinzel,serif;letter-spacing:.12em;color:var(--gold2);background:linear-gradient(180deg,#1e2328,#0a1428);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);transition:filter .2s}
.play::before{content:"";position:absolute;inset:0;padding:2px;background:linear-gradient(180deg,var(--hex),var(--hexd));clip-path:inherit;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.play::after{content:"";position:absolute;inset:4px;background:radial-gradient(ellipse at 50% 120%,rgba(10,200,185,.45),transparent 70%);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);opacity:.7;transition:opacity .2s}
.play:hover{filter:brightness(1.25)}
.play:hover::after{opacity:1}
.play span{position:relative;z-index:1}
.navs{display:flex;gap:4px;height:100%;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.navs button{position:relative;border:0;background:none;cursor:pointer;padding:0 14px;font:700 13px Cinzel,serif;letter-spacing:.12em;color:#a09b8c;white-space:nowrap;transition:color .2s}
.navs button:hover{color:var(--gold2)}
.navs button.on{color:var(--gold2)}
.navs button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:14px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.right{display:flex;align-items:center;gap:14px;flex:none}
.wallet{display:flex;gap:16px;margin-bottom:12px;padding:8px 12px;border:1px solid rgba(120,90,40,.45);background:rgba(1,10,19,.6)}
.cur{display:flex;align-items:center;gap:6px;font:700 13px Lato,sans-serif;color:var(--gold2);white-space:nowrap}
.cur svg{width:18px;height:18px}
.prof{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.avatar{position:relative;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1b4b5a,#071622);border:2px solid var(--gold);display:grid;place-items:center}
.avatar svg{width:28px;height:28px}
.avatar b{position:absolute;bottom:-8px;left:50%;translate:-50% 0;font:700 10px Lato;background:#010a13;border:1px solid var(--gold3);color:var(--gold2);padding:0 5px;border-radius:7px}
.prof .nm{font:700 13px Lato;color:var(--gold2)}
.prof .st{font-size:11px;color:#0acbe6;display:flex;align-items:center;gap:5px}
.prof .st i{width:7px;height:7px;border-radius:50%;background:#0acbe6;box-shadow:0 0 6px #0acbe6}
.prof .st.bad{color:var(--red)}.prof .st.bad i{background:var(--red);box-shadow:0 0 6px var(--red)}
.mini{display:flex;gap:6px}
.lbtn{height:30px;padding:0 10px;border:1px solid var(--gold3);background:#1e2328;color:var(--gold2);font:700 11px Cinzel,serif;letter-spacing:.08em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.lbtn:hover{border-color:var(--gold);background:#2a2f36}
select.lbtn{appearance:none;-webkit-appearance:none;padding-right:10px}
select.lbtn option{background:#010a13}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(330px,430px) 1fr;gap:0}
.left{display:flex;flex-direction:column;min-height:0;padding:20px 18px 18px 22px;border-right:1px solid rgba(120,90,40,.35);background:linear-gradient(90deg,rgba(1,10,19,.75),rgba(1,10,19,.35));transform:translateX(-30px);opacity:0;transition:all .9s cubic-bezier(.2,.8,.2,1) .55s}
#app.on .left{transform:none;opacity:1}
.lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.lh h2{margin:0;font:700 15px Cinzel,serif;letter-spacing:.14em;color:var(--gold2)}
.lh small{font:700 11px Cinzel;color:var(--gold3);letter-spacing:.1em}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;height:36px;background:#010a13;border:1px solid var(--line);padding:0 12px 0 34px;color:var(--gold2);outline:none}
.search input:focus{border-color:var(--gold3)}
.search svg{position:absolute;left:11px;top:10px;width:15px;height:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;overflow-y:auto;padding:2px 4px 10px 2px;scrollbar-width:thin;scrollbar-color:var(--gold3) transparent}
.champ{position:relative;cursor:pointer;text-align:center;animation:cin .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes cin{from{opacity:0;transform:translateY(10px) scale(.94)}}
.portrait{position:relative;aspect-ratio:1;border:1px solid var(--gold3);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 45%,#0a1428),#030b16 75%);overflow:hidden;transition:all .2s}
.portrait svg{position:absolute;inset:14%;width:72%;height:72%;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 70%,transparent))}
.portrait .cd{position:absolute;left:4px;top:3px;font:700 11px Cinzel;color:var(--gold2);text-shadow:0 1px 2px #000}
.portrait .tag{position:absolute;right:4px;bottom:3px;font:700 9px Lato;letter-spacing:.06em;color:#cdbe91;text-shadow:0 1px 2px #000}
.champ:hover .portrait{border-color:var(--gold);transform:translateY(-2px)}
.champ.sel .portrait{border:2px solid var(--gold2);box-shadow:0 0 0 1px var(--gold3),0 0 18px rgba(200,170,110,.45)}
.champ .nm{margin-top:5px;font-size:11.5px;color:var(--text);line-height:1.2}
.champ.sel .nm{color:var(--gold2)}
.champ.hide{display:none}

.splash{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:0 4vw 5vh}
.splash .art{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 40%,color-mix(in srgb,var(--c) 38%,transparent),transparent 60%),radial-gradient(ellipse at 30% 110%,rgba(200,170,110,.18),transparent 55%);transition:background 1s}
.splash .bigrune{position:absolute;right:4vw;top:50%;width:min(52vh,44vw);aspect-ratio:1;translate:0 -58%;opacity:.95}
.splash .bigrune .rr{transform-origin:50% 50%;animation:spin 60s linear infinite}
.splash .bigrune .rr2{transform-origin:50% 50%;animation:spin 40s linear infinite reverse}
.splash .bigrune .core{transition:transform .6s cubic-bezier(.2,1.5,.4,1)}
.splash.swap .bigrune .core{transform:scale(.6) rotate(-20deg);opacity:.2}
.info{position:relative;max-width:640px;transition:all .5s cubic-bezier(.2,.8,.2,1)}
.splash.swap .info{opacity:0;transform:translateX(-20px)}
.info .role{display:flex;align-items:center;gap:10px;font:700 12px Cinzel;letter-spacing:.25em;color:var(--hex)}
.info .role::before{content:"";width:34px;height:1px;background:var(--hex)}
.info h1{margin:8px 0 2px;font:900 clamp(40px,6vw,82px)/.95 Cinzel,serif;background:linear-gradient(180deg,#f0e6d2 20%,#c8aa6e 70%,#785a28);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
.info h2{margin:0 0 14px;font:700 clamp(15px,1.7vw,21px) Cinzel,serif;letter-spacing:.14em;color:var(--gold)}
.info p{margin:0 0 20px;color:#cdbe91;font-size:15px;max-width:540px}
.abil{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.ab{position:relative;width:54px;height:54px;border:1px solid var(--gold3);background:linear-gradient(135deg,#1e2328,#091428);display:grid;place-items:center;cursor:help}
.ab b{font:900 18px Cinzel;color:var(--gold2)}
.ab small{position:absolute;left:3px;top:1px;font:700 9px Lato;color:var(--hex)}
.ab:hover{border-color:var(--gold)}
.ab .tt{position:absolute;bottom:calc(100% + 10px);left:0;width:280px;padding:10px 12px;background:#010a13;border:1px solid var(--gold3);color:var(--text);font-size:12.5px;display:none;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.ab .tt h4{margin:0 0 4px;font:700 13px Cinzel;color:var(--gold2)}
.ab .tt code{font-family:ui-monospace,Menlo,monospace;color:var(--hex);word-break:break-all}
.ab:hover .tt{display:block}
.lock{position:relative;height:58px;min-width:260px;padding:0 40px;border:0;cursor:pointer;font:900 20px Cinzel,serif;letter-spacing:.18em;color:var(--gold2);background:linear-gradient(180deg,#1e2328,#0a1428);box-shadow:0 0 0 2px var(--gold3),0 0 0 4px #010a13,0 0 0 5px var(--gold3),0 10px 30px rgba(0,0,0,.5);transition:all .2s}
.lock::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 130%,rgba(200,170,110,.5),transparent 65%);opacity:.6;transition:opacity .2s}
.lock:hover{color:#fff;box-shadow:0 0 0 2px var(--gold),0 0 0 4px #010a13,0 0 0 5px var(--gold),0 0 30px rgba(200,170,110,.4)}
.lock:hover::after{opacity:1}
.lock span{position:relative;z-index:1}
.lock.go{animation:lockgo .6s ease}
@keyframes lockgo{30%{transform:scale(.96);filter:brightness(2)}}

#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(1,10,19,.75);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#modal.on{opacity:1;visibility:visible}
.mwin{position:relative;width:min(1200px,100%);height:min(86vh,880px);display:flex;flex-direction:column;background:linear-gradient(180deg,#0a1428,#010a13);border:2px solid var(--gold3);box-shadow:0 0 0 1px #010a13,0 0 0 3px rgba(120,90,40,.4),0 30px 80px rgba(0,0,0,.7);transform:scale(.92) translateY(20px);transition:transform .45s cubic-bezier(.2,1.2,.3,1)}
#modal.on .mwin{transform:none}
.mwin::before,.mwin::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold);pointer-events:none}
.mwin::before{left:-6px;top:-6px;border-right:0;border-bottom:0}
.mwin::after{right:-6px;bottom:-6px;border-left:0;border-top:0}
.mtop{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid rgba(120,90,40,.5)}
.mtop h3{margin:0;flex:1;font:700 15px Cinzel;letter-spacing:.2em;color:var(--gold2)}
.xbtn{width:34px;height:34px;border:1px solid var(--gold3);background:#1e2328;color:var(--gold2);cursor:pointer;font-size:18px;line-height:1}
.xbtn:hover{border-color:var(--gold)}
.mbody{flex:1;min-height:0;display:flex;flex-direction:column}

.fp{display:flex;flex-direction:column;flex:1;min-height:0}
.fp-head{display:flex;align-items:center;gap:14px;padding:16px 22px 8px}
.fp-code{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--gold3);background:radial-gradient(circle,color-mix(in srgb,var(--qc) 40%,#0a1428),#030b16);font:700 14px Cinzel;color:var(--gold2)}
.fp-titles{flex:1;min-width:0}
.fp-cat{font:700 11px Cinzel;letter-spacing:.2em;color:var(--hex)}
.fp-title{margin:0;font:700 20px Cinzel;color:var(--gold2)}
.fp-ep{font:12px ui-monospace,Menlo,monospace;color:#7d7a6f;word-break:break-all}
.fp-actions:empty{display:none}
.fp-form{display:flex;flex-wrap:wrap;gap:10px 14px;padding:6px 22px 2px;align-items:flex-end}
.fp-modes{display:flex;gap:0;width:100%;border:1px solid var(--gold3)}
.fp-modes button{flex:1;height:34px;border:0;background:#010a13;color:var(--text);font:700 12px Cinzel;letter-spacing:.14em;cursor:pointer}
.fp-modes button+button{border-left:1px solid var(--gold3)}
.fp-modes button.on{background:linear-gradient(180deg,#1e2328,#2b2414);color:var(--gold2)}
.fp-field{display:flex;flex-direction:column;gap:4px;font:700 10.5px Cinzel;letter-spacing:.14em;color:var(--gold)}
.fp-field[hidden]{display:none}
.fp-field.fp-wide{width:100%}
.fp-field input,.fp-field select{height:36px;min-width:150px;background:#010a13;border:1px solid var(--line);color:var(--gold2);padding:0 10px;outline:none;font:14px Lato;letter-spacing:0}
.fp-field input:focus,.fp-field select:focus{border-color:var(--gold)}
.fp-field select option{background:#010a13}
.fp-items{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fp-item{display:flex;gap:6px;align-items:center;color:var(--gold3)}
.fp-item .fp-ip{width:150px;min-width:0}.fp-item .fp-ic{width:76px;min-width:0}
.fp-btn{height:36px;padding:0 16px;border:1px solid var(--gold3);background:#1e2328;color:var(--gold2);font:700 12px Cinzel;letter-spacing:.12em;cursor:pointer}
.fp-btn:hover{border-color:var(--gold);background:#2a2f36}
.fp-btn.fp-sm{height:30px;padding:0 10px;font-size:11px}
.fp-run{border:1px solid var(--hex2);background:linear-gradient(180deg,#0a323c,#052029);color:#cdfaf6;min-width:170px}
.fp-run:hover{border-color:var(--hex);box-shadow:0 0 14px rgba(10,200,185,.35)}
.fp-run:disabled{opacity:.6;cursor:wait}
.fp-bar{display:flex;gap:12px;align-items:center;padding:12px 22px;flex-wrap:wrap}
.fp-seg{display:inline-flex;border:1px solid var(--gold3)}
.fp-seg button{border:0;background:#010a13;padding:6px 14px;color:var(--text);font:700 11px Cinzel;letter-spacing:.12em;cursor:pointer}
.fp-seg button.on{background:#2b2414;color:var(--gold2)}
.fp-stat{margin-left:auto;font-size:12.5px;color:#7d7a6f}
.fp-stat b{color:var(--gold2)}
.fp-out{flex:1;min-height:0;overflow:auto;padding:0 22px 22px;scrollbar-width:thin;scrollbar-color:var(--gold3) transparent}
.fp-sec{margin-bottom:18px}
.fp-sec h4{margin:0 0 8px;font:700 13px Cinzel;letter-spacing:.2em;color:var(--gold)}
.fp-tablewrap{border:1px solid rgba(120,90,40,.6)}
.fp-table{border-collapse:collapse;width:100%;font-size:13px}
.fp-table th{position:sticky;top:0;background:#0f1a2b;text-align:left;font:700 10.5px Cinzel;letter-spacing:.14em;color:var(--gold);padding:10px 12px;border-bottom:1px solid var(--gold3);cursor:pointer;white-space:nowrap}
.fp-table th:hover{color:var(--gold2)}
.fp-table th[data-s]::after{content:attr(data-s);margin-left:5px;font-size:9px}
.fp-table td{padding:9px 12px;border-bottom:1px solid rgba(60,60,65,.6);white-space:nowrap;color:#cdbe91}
.fp-table tbody tr{animation:rin .4s ease both}
.fp-table tbody tr:hover td{background:rgba(200,170,110,.07);color:var(--gold2)}
@keyframes rin{from{opacity:0;transform:translateX(-8px)}}
.fp-r{text-align:right!important;font-variant-numeric:tabular-nums}
.fp-chip{font:700 10.5px Cinzel;letter-spacing:.1em;padding:2px 8px;border:1px solid currentColor}
.fp-ok{color:#0ac8b9}.fp-warn{color:#f0b232}.fp-bad{color:var(--red)}.fp-info{color:#7aa7ff}
.fp-barcell{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.fp-track{width:110px;height:8px;background:#010a13;border:1px solid var(--gold3)}
.fp-track i{display:block;height:100%;background:linear-gradient(90deg,var(--hexd),var(--hex));box-shadow:0 0 8px rgba(10,200,185,.6)}
.fp-empty{padding:30px;text-align:center;font:700 12px Cinzel;letter-spacing:.2em;color:#5b5a56}
.fp-json{margin:0;font:12px/1.55 ui-monospace,Menlo,monospace;color:#cdbe91;white-space:pre-wrap;word-break:break-word}
.fp-error{padding:16px;border:1px solid rgba(232,64,87,.5);background:rgba(232,64,87,.07);color:#f6c1c9;white-space:pre-wrap}
.fp-error b{display:block;font:700 12px Cinzel;letter-spacing:.2em;color:var(--red);margin-bottom:4px}
.fp-note{font:12px ui-monospace,Menlo,monospace;color:#7d7a6f}
.fp-loading{display:flex;justify-content:center;align-items:center;gap:8px;padding:40px;font:700 12px Cinzel;letter-spacing:.25em;color:var(--gold)}
.fp-loading i{width:9px;height:9px;transform:rotate(45deg);background:var(--hex);box-shadow:0 0 8px var(--hex);animation:ld 1s ease-in-out infinite}
.fp-loading i:nth-child(2){animation-delay:.15s}.fp-loading i:nth-child(3){animation-delay:.3s}
.fp-loading span{margin-left:8px}
@keyframes ld{50%{opacity:.2;transform:rotate(45deg) scale(.5)}}

#banner{position:fixed;left:0;right:0;top:38%;z-index:80;text-align:center;pointer-events:none;opacity:0}
#banner.on{animation:ban 2.6s ease forwards}
#banner h1{margin:0;font:900 clamp(48px,10vw,130px) Cinzel,serif;letter-spacing:.2em;padding-left:.2em;background:linear-gradient(180deg,#fff7e0,#f0d48a 45%,#a07a2c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(240,200,110,.6))}
#banner.bad h1{background:linear-gradient(180deg,#ffd0d6,#e84057 50%,#7a1020);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 30px rgba(232,64,87,.6))}
#banner p{margin:4px 0 0;font:700 16px Cinzel;letter-spacing:.3em;color:var(--gold2)}
#banner::before{content:"";position:absolute;left:0;right:0;top:50%;height:160px;translate:0 -50%;background:linear-gradient(90deg,transparent,rgba(1,10,19,.85) 25%,rgba(1,10,19,.85) 75%,transparent);z-index:-1}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.98)}}

@media (max-width:900px){
  nav.top{height:auto;flex-wrap:wrap;padding:10px 12px;gap:10px}
  .navs{order:3;flex-basis:100%;height:40px}
  .navs button.on::after{bottom:4px}
  .prof .nm,.prof .st{display:none}
  .prof{border:0;padding:0}
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
  .left{max-height:none;border-right:0;padding:14px}
  .grid{grid-template-columns:repeat(5,1fr);max-height:none;overflow:visible}
  .splash{min-height:70vh;padding:20px 16px 30px}
  .splash .bigrune{width:70vw;right:-10vw;top:30%;opacity:.4}
  .play{min-width:0;padding:0 20px 0 16px;font-size:14px}
}
</style>
</head>
<body>
<div class="bgart"></div>
<canvas id="fx"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0e6d2"/><stop offset=".5" stop-color="#c8aa6e"/><stop offset="1" stop-color="#785a28"/></linearGradient>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdfaf6"/><stop offset="1" stop-color="#0397ab"/></linearGradient>
  </defs>
</svg>

<div id="intro">
  <div class="ic">
    <svg viewBox="0 0 400 400">
      <circle class="ring" cx="200" cy="200" r="190"/>
      <circle class="ring r2" cx="200" cy="200" r="172"/>
      <polygon class="ring r3" points="200,40 339,120 339,280 200,360 61,280 61,120"/>
      <g class="runes" fill="none" stroke="#c8aa6e" stroke-width="1.2">
        <circle cx="200" cy="200" r="150" stroke-dasharray="4 10"/>
        <path d="M200 30v24M200 346v24M30 200h24M346 200h24M80 80l17 17M303 303l17 17M80 320l17-17M303 97l17-17"/>
      </g>
    </svg>
    <svg class="iemb" viewBox="0 0 100 100"><use href="#embl"/></svg>
    <div class="iflash"></div>
    <div class="ititle"><h1>FARMA OF LEGENDS</h1><p>LA LIGA DE LAS FARMACIAS</p></div>
  </div>
  <div class="iskip">CLIC PARA SALTEAR</div>
</div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="embl" viewBox="0 0 100 100">
    <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="#071622" stroke="url(#gg)" stroke-width="4"/>
    <polygon points="50,14 81,32 81,68 50,86 19,68 19,32" fill="none" stroke="#785a28" stroke-width="1.5"/>
    <path d="M42 26h16v16h16v16H58v16H42V58H26V42h16z" fill="url(#hg)" stroke="#cdfaf6" stroke-width="1"/>
  </symbol>
</svg>

<div id="app">
  <nav class="top">
    <svg class="emb" viewBox="0 0 100 100"><use href="#embl"/></svg>
    <button class="play" id="play"><span>CONSULTAR</span></button>
    <div class="navs" id="navs"></div>
    <div class="right">
      <div class="mini"><a class="lbtn" id="docs" target="_blank" rel="noopener">API</a><button class="lbtn" id="mute"></button><span id="themes"></span></div>
      <div class="prof">
        <div class="avatar"><svg viewBox="0 0 100 100"><use href="#embl"/></svg><b>15</b></div>
        <div><div class="nm">Grupo 10</div><div class="st" id="st"><i></i><span>Conectando</span></div></div>
      </div>
    </div>
  </nav>
  <main>
    <section class="left">
      <div class="lh"><h2>ELEGÍ TU CONSULTA</h2><small id="count"></small></div>
      <div class="wallet">
        <span class="cur" title="Productos activos (MongoDB)"><svg viewBox="0 0 20 20"><polygon points="10,1 18,7 15,18 5,18 2,7" fill="#0ac8b9" stroke="#cdfaf6"/></svg><span id="kp">-</span></span>
        <span class="cur" title="Lotes con menos de 50 unidades (Redis)"><svg viewBox="0 0 20 20"><polygon points="10,1 18,10 10,19 2,10" fill="#e84057" stroke="#ffd0d6"/></svg><span id="kl">-</span></span>
        <span class="cur" title="Ingresos del mes"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#c8aa6e" stroke="#f0e6d2"/><text x="10" y="14" font-size="10" text-anchor="middle" fill="#463714" font-weight="700">$</text></svg><span id="ki">-</span></span>
      </div>
      <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="#785a28" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="M13 13l5 5"/></svg><input id="q" placeholder="Buscar por código o nombre"></label>
      <div class="grid" id="grid"></div>
    </section>
    <section class="splash" id="splash">
      <div class="art"></div>
      <svg class="bigrune" viewBox="0 0 400 400">
        <g class="rr" fill="none" stroke="#c8aa6e" stroke-opacity=".55">
          <circle cx="200" cy="200" r="190" stroke-width="1.5"/>
          <circle cx="200" cy="200" r="176" stroke-dasharray="2 9"/>
          <path d="M200 6v30M200 364v30M6 200h30M364 200h30" stroke-width="2"/>
        </g>
        <g class="rr2" fill="none" stroke="#0ac8b9" stroke-opacity=".45">
          <polygon points="200,46 333,123 333,277 200,354 67,277 67,123" stroke-width="1.5"/>
          <circle cx="200" cy="200" r="140" stroke-dasharray="30 12"/>
        </g>
        <g class="core" id="core" transform-origin="200 200"></g>
      </svg>
      <div class="info" id="info">
        <div class="role" id="role"></div>
        <h1 id="scode"></h1>
        <h2 id="sepi"></h2>
        <p id="sdesc"></p>
        <div class="abil" id="abil"></div>
        <button class="lock" id="lock"><span>FIJAR CONSULTA</span></button>
      </div>
    </section>
  </main>
</div>

<div id="modal" aria-hidden="true">
  <div class="mwin">
    <div class="mtop"><h3 id="mtitle">ESTADÍSTICAS DE LA PARTIDA</h3><button class="xbtn" id="mclose" title="Cerrar (Esc)">✕</button></div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>
<div id="banner"><h1 id="btxt"></h1><p id="bsub"></p></div>

<script>
(() => {
"use strict";
const F = window.Farma, { el, FMT } = F;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs = {}, ...kids) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); kids.forEach(k => n.append(k)); return n; };

const EPI = {
  Q01: "El Catálogo Eterno", Q02: "La Venta Suspendida", Q03: "El Cronista de Clientes", Q04: "El Coleccionista de Recetas",
  Q05: "El Farmacéutico Incansable", Q06: "La Dispensa Olvidada", Q07: "El Más Vendido", Q08: "El Guardián del Stock",
  Q09: "El Mercader Libre", Q10: "El Señor de la Sucursal", Q11: "El Tesorero del Mes", Q12: "Los Clientes Perdidos",
  Q13: "El Escriba del Padrón", Q14: "El Forjador de Ventas", Q15: "El Alquimista FEFO",
};
const GLYPH = {
  productos: "M30 62l24-24a10 10 0 0 1 14 14L44 76a10 10 0 0 1-14-14zM42 50l14 14",
  ventas: "M50 22a28 28 0 1 0 .1 0zM50 34v32M40 42h16a6 6 0 0 1 0 12H44a6 6 0 0 0 0 12h16",
  clientes: "M50 26a12 12 0 1 0 .1 0zM28 78c2-14 11-22 22-22s20 8 22 22",
  recetas: "M32 22h30l8 8v48H32zM40 40h22M40 50h22M40 60h14",
  farmaceuticos: "M42 22h16M45 22v16L30 70a6 6 0 0 0 5 8h30a6 6 0 0 0 5-8L55 38V22M36 58h28",
  sucursales: "M26 78V42l24-18 24 18v36zM42 78V60h16v18M46 40h8M50 36v8",
  stock: "M24 36l26-12 26 12v30L50 78 24 66zM24 36l26 12 26-12M50 48v30",
};
const ROLE = { productos: "CATÁLOGO", ventas: "COMERCIO", clientes: "PADRÓN", recetas: "CLÍNICA", farmaceuticos: "PERSONAL", sucursales: "TERRITORIO", stock: "DEPÓSITO" };

function emblem(q, big) {
  const s = svg("svg", { viewBox: "0 0 100 100" });
  s.append(svg("polygon", { points: "50,4 90,27 90,73 50,96 10,73 10,27", fill: "rgba(1,10,19,.55)", stroke: "url(#gg)", "stroke-width": big ? 2 : 3 }));
  s.append(svg("path", { d: GLYPH[q.cat], fill: "none", stroke: q.color, "stroke-width": big ? 3 : 4.5, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  return s;
}

const cv = $("fx"), cx = cv.getContext("2d");
let W, H;
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
resize(); addEventListener("resize", resize);
const motes = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.8, s: .01 + Math.random() * .03, d: Math.random() * 6.28, gold: Math.random() < .45 }));
let accent = "#0ac8b9";
(function fx(t) {
  cx.clearRect(0, 0, W, H);
  cx.globalCompositeOperation = "lighter";
  for (const m of motes) {
    m.y -= m.s * .016; m.x += Math.sin(t / 2000 + m.d) * .0003;
    if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); }
    const a = .35 + .35 * Math.sin(t / 600 + m.d);
    const g = cx.createRadialGradient(m.x * W, m.y * H, 0, m.x * W, m.y * H, m.r * 5);
    g.addColorStop(0, m.gold ? `rgba(240,210,140,${a})` : `rgba(10,200,185,${a})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    cx.fillStyle = g;
    cx.fillRect(m.x * W - m.r * 5, m.y * H - m.r * 5, m.r * 10, m.r * 10);
  }
  cx.globalCompositeOperation = "source-over";
  requestAnimationFrame(fx);
})(0);

const cats = ["todas", ...Object.keys(F.CATS)];
let filter = "todas", sel = F.QUERIES[+(F.store.get("fol.sel") || 6)] || F.QUERIES[6];
$("navs").replaceChildren(el("button", { class: "on", "data-k": "todas", text: "INICIO", onclick: () => setFilter("todas") }),
  ...Object.entries(F.CATS).map(([k, c]) => el("button", { "data-k": k, text: c.label.toUpperCase(), onclick: () => setFilter(k) })));
function setFilter(k) {
  filter = k;
  [...$("navs").children].forEach(b => b.classList.toggle("on", b.dataset.k === k));
  applyFilter();
  hover();
}
function applyFilter() {
  const s = $("q").value.trim().toLowerCase();
  let n = 0;
  for (const c of $("grid").children) {
    const q = F.byCode(c.dataset.c);
    const ok = (filter === "todas" || q.cat === filter) && (!s || `${q.code} ${q.title} ${q.short} ${EPI[q.code]}`.toLowerCase().includes(s));
    c.classList.toggle("hide", !ok);
    if (ok) n++;
  }
  $("count").textContent = `${n} DE ${F.QUERIES.length}`;
}
$("q").addEventListener("input", applyFilter);

F.QUERIES.forEach((q, i) => {
  const p = el("div", { class: "portrait" });
  p.append(emblem(q), el("span", { class: "cd", text: q.code }), el("span", { class: "tag", text: q.mutation ? "ESCRITURA" : "LECTURA" }));
  const c = el("div", { class: "champ" + (q === sel ? " sel" : ""), "data-c": q.code, style: `--c:${q.color};animation-delay:${.6 + i * .04}s`, onclick: () => choose(q), ondblclick: () => lockIn() }, p, el("div", { class: "nm", text: q.short }));
  c.addEventListener("mouseenter", hover);
  $("grid").append(c);
});
applyFilter();

function hover() { F.Sound.tone(1800, 0, .03, "sine", .015); }
function choose(q, silent) {
  if (q !== sel && !silent) { F.Sound.tone(520, 0, .12, "triangle", .04); F.Sound.tone(780, .05, .2, "sine", .03); }
  sel = q;
  F.store.set("fol.sel", String(F.QUERIES.indexOf(q)));
  [...$("grid").children].forEach(c => c.classList.toggle("sel", c.dataset.c === q.code));
  const sp = $("splash");
  sp.classList.add("swap");
  setTimeout(() => {
    sp.style.setProperty("--c", q.color);
    $("role").textContent = `${ROLE[q.cat]} · ${q.engine.toUpperCase()}`;
    $("scode").textContent = q.code;
    $("sepi").textContent = EPI[q.code].toUpperCase();
    $("sdesc").textContent = `${q.title}. ${q.desc}`;
    const core = $("core");
    core.replaceChildren(svg("polygon", { points: "200,90 295,145 295,255 200,310 105,255 105,145", fill: "rgba(1,10,19,.5)", stroke: "url(#gg)", "stroke-width": 3 }),
      svg("path", { d: GLYPH[q.cat], fill: "none", stroke: q.color, "stroke-width": 3.5, "stroke-linecap": "round", "stroke-linejoin": "round", transform: "translate(110 110) scale(1.8)", style: `filter:drop-shadow(0 0 10px ${q.color})` }));
    const fields = (q.fields || []).filter(f => !f.modes || f.modes.includes((q.modes || [])[0]));
    const abilities = [
      { k: "P", t: q.mutation ? "Escritura" : "Lectura", d: q.mutation ? "Modifica datos de la base." : "Solo lee datos, no modifica nada." },
      { k: "Q", t: "Método", d: q.method, code: true },
      { k: "W", t: "Motor", d: q.engine },
      { k: "E", t: "Endpoint", d: q.path, code: true },
      { k: "R", t: "Parámetros", d: fields.length ? fields.map(f => f.label).join(", ") : "No necesita parámetros." },
    ];
    $("abil").replaceChildren(...abilities.map(a => el("div", { class: "ab" }, el("small", { text: a.k }), el("b", { text: a.k }),
      el("div", { class: "tt" }, el("h4", { text: a.t }), a.code ? el("code", { text: a.d }) : el("span", { text: a.d })))));
    sp.classList.remove("swap");
  }, silent ? 0 : 260);
}

function lockIn() {
  const b = $("lock");
  b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
  F.Sound.tone(110, 0, .6, "sine", .09, 55); F.Sound.noise(0, .35, .06, 3000); F.Sound.tone(1320, .08, .9, "sine", .03); F.Sound.tone(1980, .14, .9, "sine", .02);
  setTimeout(openModal, 280);
}
$("lock").onclick = lockIn;
$("play").onclick = lockIn;

function openModal() {
  const q = sel;
  $("mtitle").textContent = q.mutation ? `${EPI[q.code].toUpperCase()} · ACCIÓN` : `${EPI[q.code].toUpperCase()} · ESTADÍSTICAS`;
  const panel = F.createPanel(q, {
    text: { run: "Invocar", runMutation: "Lanzar", loading: "Invocando", empty: "Sin resultados en la grieta", fill: "Completá los datos y lanzá la acción", invalid: "Faltan datos" },
    autorunDelay: 300,
    onSuccess: (q, req, res, msg) => { if (msg) { banner("VICTORIA", msg); refresh(); } },
    onError: e => banner("DERROTA", e.message.split("\n")[0], true),
  });
  $("mbody").replaceChildren(panel.root);
  $("modal").classList.add("on");
  $("modal").setAttribute("aria-hidden", "false");
  if (q.mutation) setTimeout(() => panel.focus(), 400);
}
function closeModal() {
  if (!$("modal").classList.contains("on")) return;
  $("modal").classList.remove("on");
  $("modal").setAttribute("aria-hidden", "true");
  F.Sound.tone(660, 0, .15, "triangle", .03); F.Sound.tone(440, .06, .2, "triangle", .03);
}
$("mclose").onclick = closeModal;
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

let banT;
function banner(t, sub, bad) {
  const b = $("banner");
  $("btxt").textContent = t;
  $("bsub").textContent = sub;
  b.classList.toggle("bad", !!bad);
  b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
  if (bad) { F.Sound.tone(196, 0, .9, "sawtooth", .04, 98); F.Sound.tone(147, .2, 1, "sine", .06); }
  else { [523, 659, 784, 1047].forEach((f, i) => F.Sound.tone(f, i * .12, .9, "triangle", .05)); F.Sound.noise(0, .5, .04, 5000); }
  clearTimeout(banT);
  banT = setTimeout(() => b.classList.remove("on"), 2700);
}

addEventListener("keydown", e => {
  if (!started) { start(); return; }
  if (e.key === "Escape") { closeModal(); return; }
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "SELECT") return;
  if ($("modal").classList.contains("on")) return;
  const vis = [...$("grid").children].filter(c => !c.classList.contains("hide")).map(c => F.byCode(c.dataset.c));
  const i = vis.indexOf(sel);
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); choose(vis[(i + 1) % vis.length]); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); choose(vis[(i - 1 + vis.length) % vis.length]); }
  else if (e.key === "Enter") { e.preventDefault(); lockIn(); }
});

async function refresh() {
  const s = await F.snapshot();
  $("kp").textContent = `${s.productos.length} productos`;
  $("kl").textContent = `${s.lotes.length} lotes bajos`;
  $("ki").textContent = `${FMT.pesos(s.totalIngresos)} este mes`;
  const st = $("st");
  st.classList.toggle("bad", !s.online);
  st.querySelector("span").textContent = s.online ? "En línea" : "Sin conexión";
}

let started = false;
function start() {
  if (started) return;
  started = true;
  $("intro").classList.add("done");
  $("app").classList.add("on");
  F.Sound.tone(98, 0, 2.2, "sine", .08, 49); F.Sound.noise(0, 1.2, .04, 800);
  [392, 587, 784, 1175].forEach((f, i) => F.Sound.tone(f, .3 + i * .18, 1.6, "sine", .03));
}
$("intro").addEventListener("click", start);
setTimeout(start, 4600);

$("docs").href = F.API.base + "/docs";
const paintMute = () => ($("mute").textContent = F.Sound.muted ? "SONIDO: NO" : "SONIDO: SÍ");
paintMute();
$("mute").onclick = () => { F.Sound.toggle(); paintMute(); };
$("themes").append(F.themeSwitcher("farmaoflegends", "lbtn"));
choose(sel, true);
refresh();
setInterval(refresh, 30000);
})();
</script>
</body>
</html>
