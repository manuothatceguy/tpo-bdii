<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>FarmaNite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<script src="core.js"></script>
<style>
:root{
  --sky1:#0f4fd1;--sky2:#2b8cff;--sky3:#7fd0ff;--yellow:#ffe94a;--yellow2:#f7c623;--ink:#0a1b4d;--panel:rgba(9,28,86,.86);--white:#fff;--muted:#b9d3ff;
  --common:#8a9bb0;--uncommon:#62c13b;--rare:#2fa8ff;--epic:#b74cf0;--legendary:#f08a2a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky1);color:var(--white);font:600 16px/1.3 "Barlow Condensed",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.an{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em}

.sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% -10%,#bfe9ff 0%,var(--sky3) 18%,var(--sky2) 45%,var(--sky1) 80%,#0a2f8f 100%);overflow:hidden}
.rays{position:absolute;left:50%;top:-40vmax;width:200vmax;height:200vmax;translate:-50% 0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0 6deg,transparent 6deg 15deg);animation:rot 80s linear infinite;mask:radial-gradient(circle,#000 0%,transparent 60%);-webkit-mask:radial-gradient(circle,#000 0%,transparent 60%)}
@keyframes rot{to{transform:rotate(360deg)}}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;filter:drop-shadow(0 8px 0 rgba(120,170,255,.35));animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:180%;left:15%;bottom:20%}
.cloud::after{width:40%;height:140%;right:12%;bottom:25%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.hills{position:absolute;left:-5%;right:-5%;bottom:-2px;height:28vh}
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}

#load{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end;padding:6vh 6vw;background:linear-gradient(135deg,#1240b8,#0a1f6a);overflow:hidden;transition:transform .7s cubic-bezier(.7,0,.3,1) .1s}
#load.done{transform:translateY(-105%)}
#load::before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(-30deg,rgba(255,255,255,.04) 0 40px,transparent 40px 80px);animation:stripes 6s linear infinite}
@keyframes stripes{to{transform:translateX(160px)}}
.lcard{position:absolute;left:50%;top:44%;translate:-50% -50%;width:min(520px,82vw);aspect-ratio:4/3;border-radius:18px;background:radial-gradient(circle at 50% 40%,#ffd36b,#f08a2a 55%,#9a3a0b);box-shadow:0 0 0 6px #fff,0 30px 60px rgba(0,0,0,.4);transform:rotate(-3deg);display:grid;place-items:center;animation:lc 1.2s cubic-bezier(.2,1.6,.4,1) both}
@keyframes lc{from{transform:rotate(-12deg) scale(.5);opacity:0}}
.lcard svg{width:46%;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.lcard .lname{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.65));border-radius:0 0 18px 18px;font:400 clamp(28px,4vw,44px) Anton,sans-serif;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.ltip{position:relative;max-width:760px;margin-bottom:22px}
.ltip b{display:inline-block;background:var(--yellow);color:var(--ink);padding:2px 10px;font:400 18px Anton;transform:skew(-8deg);margin-bottom:8px}
.ltip p{margin:0;font:700 clamp(18px,2.2vw,24px) "Barlow Condensed";text-shadow:0 2px 0 rgba(0,0,0,.3)}
.lbar{position:relative;display:flex;gap:6px;max-width:760px}
.lbar i{flex:1;height:14px;background:rgba(255,255,255,.18);transform:skew(-20deg);transition:background .2s}
.lbar i.on{background:var(--yellow);box-shadow:0 0 12px rgba(255,233,74,.7)}
.lpct{position:relative;margin-top:10px;font:400 20px Anton;letter-spacing:.05em}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:20px;padding:12px 22px;background:linear-gradient(180deg,rgba(6,22,80,.85),rgba(6,22,80,0));transform:translateY(-110%);transition:transform .7s cubic-bezier(.2,1.3,.4,1) .55s}
#app.on header{transform:none}
.logo{font:400 34px/1 Anton,sans-serif;letter-spacing:.02em;transform:skew(-8deg);color:#fff;text-shadow:0 3px 0 #0a3bb0,0 6px 0 #062370,0 8px 14px rgba(0,0,0,.35);-webkit-text-stroke:1px #0a3bb0;white-space:nowrap}
.logo span{color:var(--yellow)}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font:400 19px Anton,sans-serif;letter-spacing:.03em;color:rgba(255,255,255,.65);text-transform:uppercase;white-space:nowrap;position:relative}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff}
.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:4px;background:var(--yellow);transform:skew(-20deg)}
.hr{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:17px;background:rgba(5,20,70,.7);border:2px solid rgba(255,255,255,.15);font:700 17px "Barlow Condensed";white-space:nowrap}
.pill i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-style:normal;font:400 13px Anton;color:var(--ink)}
.sbtn{height:34px;padding:0 12px;border:2px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(5,20,70,.7);cursor:pointer;font:700 15px "Barlow Condensed";letter-spacing:.04em;text-transform:uppercase;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.sbtn:hover{border-color:#fff}
select.sbtn{appearance:none;-webkit-appearance:none}
select.sbtn option{background:#0a1f6a}

.shop{flex:1;min-height:0;overflow-y:auto;padding:4px 22px 140px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.4) transparent}
.shead{display:flex;align-items:flex-end;gap:16px;margin:6px 0 12px;opacity:0;transform:translateX(-30px);transition:all .6s ease .8s}
#app.on .shead{opacity:1;transform:none}
.shead h1{margin:0;font:400 clamp(30px,4vw,52px)/1 Anton;text-transform:uppercase;transform:skew(-6deg);text-shadow:0 4px 0 rgba(0,0,0,.25)}
.shead .timer{font:700 18px "Barlow Condensed";color:var(--muted);margin-bottom:6px}
.shead .timer b{color:#fff}
.sec-t{display:flex;align-items:center;gap:10px;margin:14px 0 10px;font:400 22px Anton;text-transform:uppercase;letter-spacing:.03em}
.sec-t::after{content:"";flex:1;height:3px;background:linear-gradient(90deg,rgba(255,255,255,.5),transparent)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.daily{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}

.card{position:relative;aspect-ratio:3/4;border-radius:10px;cursor:pointer;overflow:hidden;background:radial-gradient(circle at 50% 38%,var(--r1),var(--r2) 62%,var(--r3));box-shadow:0 0 0 3px rgba(255,255,255,.85),0 10px 24px rgba(4,20,80,.45);transform:scale(0) rotate(-6deg);transition:transform .22s cubic-bezier(.2,1.6,.4,1),box-shadow .2s}
#app.on .card{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
@keyframes pop{0%{transform:scale(0) rotate(-6deg)}100%{transform:none}}
.card.ready{animation:none!important;transform:none}
.card:hover{transform:translateY(-6px) rotate(-1.2deg) scale(1.03)!important;box-shadow:0 0 0 4px var(--yellow),0 16px 32px rgba(4,20,80,.55)}
.card.sel{box-shadow:0 0 0 5px var(--yellow),0 0 26px rgba(255,233,74,.65)}
.card.feat2{aspect-ratio:4/3.4}
.card .bgpat{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 12px,transparent 12px 24px);mix-blend-mode:overlay}
.card .glyph{position:absolute;left:50%;top:40%;width:56%;translate:-50% -50%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));transition:transform .3s}
.card:hover .glyph{transform:scale(1.08) rotate(-4deg)}
.card .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);transition:none}
.card:hover .shine{transform:translateX(120%);transition:transform .7s ease}
.card .code{position:absolute;left:10px;top:8px;font:400 22px Anton;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.card .rar{position:absolute;right:8px;top:10px;padding:1px 8px;border-radius:4px;background:rgba(0,0,0,.35);font:800 12px "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase}
.card .plate{position:absolute;left:0;right:0;bottom:0;padding:9px 11px 10px;background:linear-gradient(transparent,rgba(5,15,50,.85) 28%);}
.card .nm{font:400 clamp(17px,1.5vw,22px)/1.02 Anton;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.card .meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font:700 14px "Barlow Condensed";color:var(--muted)}
.card .price{display:inline-flex;align-items:center;gap:4px;color:#fff}
.card .price i{width:16px;height:16px;border-radius:50%;background:var(--yellow);display:inline-block;box-shadow:inset 0 -2px 0 var(--yellow2)}
.card .rbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--r1)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:16px 22px 18px;background:linear-gradient(transparent,rgba(6,22,80,.75));pointer-events:none;transform:translateY(110%);transition:transform .7s cubic-bezier(.2,1.3,.4,1) .9s}
#app.on .bottom{transform:none}
.bottom>*{pointer-events:auto}
.squad{display:flex;align-items:center;gap:12px}
.squad .av{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,#ffd36b,#f08a2a);box-shadow:0 0 0 3px #fff;display:grid;place-items:center}
.squad .av svg{width:34px}
.squad b{display:block;font:400 22px Anton;text-transform:uppercase}
.squad small{display:flex;align-items:center;gap:6px;font:700 15px "Barlow Condensed";color:var(--muted)}
.squad small i{width:9px;height:9px;border-radius:50%;background:#59ff59;box-shadow:0 0 8px #59ff59}
.squad small.bad i{background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}
.go{text-align:right}
.go .mode{display:inline-block;margin-bottom:6px;padding:4px 12px;background:rgba(5,20,70,.8);border-radius:6px;font:700 16px "Barlow Condensed";text-transform:uppercase;letter-spacing:.04em}
.go .mode b{color:var(--yellow)}
.play{display:block;min-width:300px;height:78px;border:0;border-radius:10px;cursor:pointer;font:400 44px/1 Anton;text-transform:uppercase;color:var(--ink);background:linear-gradient(180deg,#fff79a,var(--yellow) 45%,var(--yellow2));box-shadow:0 6px 0 #b38900,0 12px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.7);transform:skew(-6deg);transition:transform .1s,filter .15s}
.play:hover{filter:brightness(1.07);transform:skew(-6deg) translateY(-2px)}
.play:active{transform:skew(-6deg) translateY(4px);box-shadow:0 2px 0 #b38900,0 6px 12px rgba(0,0,0,.35)}

#detail{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:minmax(260px,32%) 1fr;background:linear-gradient(135deg,rgba(10,40,140,.96),rgba(6,20,80,.97));opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
#detail.on{opacity:1;visibility:visible}
.dl{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;overflow:hidden}
.dl::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 8deg,transparent 8deg 20deg);animation:rot 40s linear infinite}
.dl .card{width:min(300px,80%);transform:none;animation:dpop .5s cubic-bezier(.2,1.6,.4,1)!important}
@keyframes dpop{from{transform:scale(.6) rotate(-8deg)}}
.dl .back{position:absolute;left:22px;top:18px;z-index:2}
.dr{display:flex;flex-direction:column;min-height:0;padding:22px 26px 22px 6px;transform:translateX(40px);opacity:0;transition:all .45s cubic-bezier(.2,1.2,.4,1) .1s}
#detail.on .dr{transform:none;opacity:1}
.dr .rtag{display:inline-block;align-self:flex-start;padding:2px 12px;background:var(--r1);font:400 18px Anton;text-transform:uppercase;transform:skew(-8deg);margin-bottom:4px}
.dbox{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:12px;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 20px 40px rgba(0,0,0,.35)}

.fp{display:flex;flex-direction:column;flex:1;min-height:0}
.fp-head{display:flex;align-items:center;gap:14px;padding:16px 20px 8px}
.fp-code{font:400 26px Anton;color:var(--yellow);transform:skew(-8deg)}
.fp-titles{flex:1;min-width:0}
.fp-cat{font:700 14px "Barlow Condensed";color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fp-title{margin:0;font:400 clamp(22px,2.4vw,32px)/1.05 Anton;text-transform:uppercase}
.fp-ep{font:600 14px ui-monospace,Menlo,monospace;color:#8fc4ff;word-break:break-all}
.fp-actions:empty{display:none}
.fp-form{display:flex;flex-wrap:wrap;gap:10px 14px;padding:6px 20px 2px;align-items:flex-end}
.fp-modes{display:flex;gap:8px;width:100%}
.fp-modes button{flex:1;height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.1);font:400 19px Anton;text-transform:uppercase;cursor:pointer;color:#cfe0ff;transform:skew(-6deg)}
.fp-modes button.on{background:var(--yellow);color:var(--ink)}
.fp-field{display:flex;flex-direction:column;gap:4px;font:700 14px "Barlow Condensed";text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fp-field[hidden]{display:none}
.fp-field.fp-wide{width:100%}
.fp-field input,.fp-field select{height:40px;min-width:150px;border:3px solid transparent;border-radius:8px;background:#fff;color:var(--ink);padding:0 10px;font:700 18px "Barlow Condensed";outline:none;letter-spacing:0;text-transform:none}
.fp-field input:focus,.fp-field select:focus{border-color:var(--yellow)}
.fp-items{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fp-item{display:flex;gap:6px;align-items:center}
.fp-item .fp-ip{width:150px;min-width:0}.fp-item .fp-ic{width:76px;min-width:0}
.fp-btn{height:40px;padding:0 16px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font:400 18px Anton;text-transform:uppercase;cursor:pointer}
.fp-btn:hover{background:rgba(255,255,255,.25)}
.fp-btn.fp-sm{height:34px;font-size:15px}
.fp-run{background:linear-gradient(180deg,#fff79a,var(--yellow) 45%,var(--yellow2));color:var(--ink);box-shadow:0 4px 0 #b38900;min-width:170px;transform:skew(-6deg);font-size:22px}
.fp-run:hover{filter:brightness(1.07);background:linear-gradient(180deg,#fff79a,var(--yellow) 45%,var(--yellow2))}
.fp-run:disabled{filter:grayscale(.6);cursor:wait}
.fp-bar{display:flex;gap:12px;align-items:center;padding:14px 20px;flex-wrap:wrap}
.fp-seg{display:inline-flex;gap:4px}
.fp-seg button{border:0;border-radius:6px;background:rgba(255,255,255,.1);padding:6px 14px;font:400 16px Anton;text-transform:uppercase;cursor:pointer;color:#cfe0ff}
.fp-seg button.on{background:#fff;color:var(--ink)}
.fp-stat{margin-left:auto;font:700 16px "Barlow Condensed";color:var(--muted)}
.fp-stat b{color:var(--yellow)}
.fp-out{flex:1;min-height:0;overflow:auto;padding:0 20px 20px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.4) transparent}
.fp-sec{margin-bottom:16px}
.fp-sec h4{margin:0 0 8px;font:400 20px Anton;text-transform:uppercase;color:var(--yellow)}
.fp-tablewrap{border-radius:10px;overflow:hidden;background:rgba(255,255,255,.06)}
.fp-table{border-collapse:collapse;width:100%;font:600 17px "Barlow Condensed"}
.fp-table th{position:sticky;top:0;background:#0d2f8c;text-align:left;font:400 15px Anton;text-transform:uppercase;letter-spacing:.03em;padding:9px 12px;cursor:pointer;white-space:nowrap}
.fp-table th[data-s]::after{content:attr(data-s);margin-left:5px;font-size:11px;color:var(--yellow)}
.fp-table td{padding:7px 12px;border-top:1px solid rgba(255,255,255,.08);white-space:nowrap}
.fp-table tbody tr{animation:rin .35s cubic-bezier(.2,1.4,.4,1) both}
.fp-table tbody tr:hover td{background:rgba(255,233,74,.12)}
@keyframes rin{from{opacity:0;transform:scale(.97) translateY(6px)}}
.fp-r{text-align:right!important;font-variant-numeric:tabular-nums}
.fp-chip{display:inline-block;padding:0 10px;border-radius:5px;font:700 14px "Barlow Condensed";text-transform:uppercase;color:#fff}
.fp-ok{background:var(--uncommon)}.fp-warn{background:var(--legendary)}.fp-bad{background:#e2384d}.fp-info{background:var(--rare)}
.fp-barcell{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.fp-track{width:120px;height:12px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden}
.fp-track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--yellow2),var(--yellow))}
.fp-empty{padding:30px;text-align:center;font:400 22px Anton;text-transform:uppercase;color:var(--muted)}
.fp-json{margin:0;font:13px/1.5 ui-monospace,Menlo,monospace;color:#cfe8ff;white-space:pre-wrap;word-break:break-word}
.fp-error{padding:16px;border-radius:10px;background:rgba(226,56,77,.2);border:2px solid #ff6b7d;white-space:pre-wrap}
.fp-error b{display:block;font:400 22px Anton;text-transform:uppercase;color:#ff8a98}
.fp-note{font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
.fp-loading{display:flex;justify-content:center;align-items:center;gap:8px;padding:40px;font:400 22px Anton;text-transform:uppercase}
.fp-loading i{width:14px;height:14px;border-radius:3px;background:var(--yellow);transform:skew(-12deg);animation:ld .8s ease-in-out infinite}
.fp-loading i:nth-child(2){animation-delay:.12s}.fp-loading i:nth-child(3){animation-delay:.24s}
.fp-loading span{margin-left:8px}
@keyframes ld{50%{transform:skew(-12deg) translateY(-10px)}}

#ban{position:fixed;left:0;right:0;top:30%;z-index:95;text-align:center;pointer-events:none;opacity:0}
#ban.on{animation:ban 2.8s cubic-bezier(.2,1.4,.4,1) forwards}
#ban .t{display:inline-block;font:400 clamp(56px,11vw,150px)/1 Anton;text-transform:uppercase;color:var(--yellow);transform:skew(-8deg);-webkit-text-stroke:3px var(--ink);text-shadow:0 8px 0 var(--ink),0 16px 30px rgba(0,0,0,.4)}
#ban.bad .t{color:#ff4d5e}
#ban .s{margin-top:16px;display:inline-block;background:#fff;color:var(--ink);padding:4px 16px;font:400 clamp(18px,2.2vw,28px) Anton;text-transform:uppercase;transform:skew(-8deg)}
#ban .n{position:absolute;left:50%;top:-58px;translate:-50% 0;font:400 64px Anton;color:#fff;-webkit-text-stroke:2px var(--ink)}
#ban.bad .n{display:none}
@keyframes ban{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}

@media (max-width:800px){
  header{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .tabs{order:3;flex-basis:100%}
  .hr .pill:not(.keep){display:none}
  .shop{padding:0 12px 150px}
  .daily{grid-template-columns:repeat(2,1fr)}
  .feat{grid-template-columns:1fr}
  .play{min-width:0;width:56vw;height:62px;font-size:32px}
  .squad .av{width:42px;height:42px}
  .squad b{font-size:17px}
  #detail{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
  .dl{padding:56px 20px 10px}
  .dl .card{width:150px}
  .dr{padding:0 10px 10px}
}
</style>
</head>
<body>
<div class="sky">
  <div class="rays"></div>
  <div id="clouds"></div>
  <svg class="hills" viewBox="0 0 1200 200" preserveAspectRatio="none">
    <path d="M0 120 C150 60 260 80 380 110 S620 40 760 90 S1000 60 1200 100 V200 H0Z" fill="#3a63d8" opacity=".55"/>
    <path d="M0 150 C180 110 300 130 450 150 S700 100 860 135 S1080 120 1200 140 V200 H0Z" fill="#2449b8" opacity=".8"/>
    <path d="M0 175 C200 160 380 170 600 178 S950 165 1200 172 V200 H0Z" fill="#14308a"/>
  </svg>
</div>
<canvas id="confetti"></canvas>

<div id="load">
  <div class="lcard" id="lcard"></div>
  <div class="ltip"><b>CONSEJO</b><p id="tip"></p></div>
  <div class="lbar" id="lbar"></div>
  <div class="lpct an" id="lpct">CARGANDO 0%</div>
</div>

<div id="app">
  <header>
    <div class="logo">FARMA<span>NITE</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="hr">
      <span class="pill" title="Productos activos"><i style="background:#62c13b">P</i><span id="kp">-</span></span>
      <span class="pill" title="Lotes con menos de 50 unidades en Redis"><i style="background:#ff6b7d">L</i><span id="kl">-</span></span>
      <span class="pill keep" title="Ingresos del mes"><i style="background:var(--yellow)">$</i><span id="ki">-</span></span>
      <a class="sbtn" id="docs" target="_blank" rel="noopener">API</a>
      <button class="sbtn" id="mute"></button>
      <span id="themes"></span>
    </div>
  </header>
  <main class="shop" id="shop">
    <div class="shead"><h1>Tienda de consultas</h1><div class="timer">SE ACTUALIZA EN: <b id="timer"></b></div></div>
    <div class="sec-t">Destacado</div>
    <div class="feat" id="feat"></div>
    <div class="sec-t">Diario</div>
    <div class="daily" id="daily"></div>
  </main>
  <div class="bottom">
    <div class="squad">
      <div class="av"><svg viewBox="0 0 40 40"><path d="M15 6h10v9h9v10h-9v9H15v-9H6V15h9z" fill="#fff" stroke="#0a1b4d" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
      <div><b>Escuadrón Grupo 10</b><small id="st"><i></i><span>Conectando</span></small></div>
    </div>
    <div class="go">
      <div class="mode" id="mode"></div>
      <button class="play" id="play">¡Consultar!</button>
    </div>
  </div>
</div>

<section id="detail" aria-hidden="true">
  <div class="dl" id="dl"><button class="fp-btn back" id="back">‹ Volver (Esc)</button></div>
  <div class="dr"><span class="rtag" id="rtag"></span><div class="dbox" id="dbox"></div></div>
</section>
<div id="ban"><div class="n">#1</div><div class="t" id="bant"></div><br><div class="s" id="bans"></div></div>

<script>
(() => {
"use strict";
const F = window.Farma, { el, FMT } = F;
const $ = id => document.getElementById(id);

const RAR = {
  legendary: { label: "Legendaria", r1: "#f7a440", r2: "#d5631b", r3: "#7a2c06" },
  epic: { label: "Épica", r1: "#cf7bff", r2: "#8a2fd0", r3: "#3c0c6b" },
  rare: { label: "Rara", r1: "#58c3ff", r2: "#1a78d6", r3: "#0a2f7a" },
  uncommon: { label: "Poco común", r1: "#8be35d", r2: "#3f9a24", r3: "#16450b" },
};
const rarity = q => (q.mutation ? "legendary" : ["stock", "recetas"].includes(q.cat) ? "epic" : ["clientes", "sucursales"].includes(q.cat) ? "rare" : "uncommon");
const GLYPH = {
  productos: '<rect x="12" y="34" width="76" height="32" rx="16" fill="#fff" transform="rotate(-35 50 50)"/><path d="M50 26 L50 74" transform="rotate(-35 50 50)" stroke="#0a1b4d" stroke-width="5"/><rect x="12" y="34" width="38" height="32" rx="16" fill="#ff5f6d" transform="rotate(-35 50 50)"/><rect x="12" y="34" width="76" height="32" rx="16" fill="none" stroke="#0a1b4d" stroke-width="5" transform="rotate(-35 50 50)"/>',
  ventas: '<circle cx="50" cy="50" r="34" fill="#ffe94a" stroke="#0a1b4d" stroke-width="5"/><circle cx="50" cy="50" r="24" fill="none" stroke="#f7c623" stroke-width="4"/><text x="50" y="64" text-anchor="middle" font-family="Anton" font-size="38" fill="#0a1b4d">$</text>',
  clientes: '<circle cx="50" cy="36" r="16" fill="#fff" stroke="#0a1b4d" stroke-width="5"/><path d="M20 86c2-20 14-32 30-32s28 12 30 32z" fill="#fff" stroke="#0a1b4d" stroke-width="5" stroke-linejoin="round"/>',
  recetas: '<path d="M26 14h36l14 14v58H26z" fill="#fff" stroke="#0a1b4d" stroke-width="5" stroke-linejoin="round"/><path d="M36 42h30M36 54h30M36 66h18" stroke="#0a1b4d" stroke-width="5" stroke-linecap="round"/><text x="34" y="34" font-family="Anton" font-size="16" fill="#ff5f6d">Rx</text>',
  farmaceuticos: '<path d="M40 12h20v24l20 40a8 8 0 0 1-7 12H27a8 8 0 0 1-7-12l20-40z" fill="#fff" stroke="#0a1b4d" stroke-width="5" stroke-linejoin="round"/><path d="M28 64h44l6 12a6 6 0 0 1-5 8H27a6 6 0 0 1-5-8z" fill="#59ff9a"/>',
  sucursales: '<path d="M14 88V44l36-26 36 26v44z" fill="#fff" stroke="#0a1b4d" stroke-width="5" stroke-linejoin="round"/><path d="M44 38h12v8h8v12h-8v8H44v-8h-8V46h8z" fill="#3fd06a"/><rect x="40" y="70" width="20" height="18" fill="#0a1b4d"/>',
  stock: '<path d="M14 32l36-16 36 16v40L50 88 14 72z" fill="#e2a65c" stroke="#0a1b4d" stroke-width="5" stroke-linejoin="round"/><path d="M14 32l36 16 36-16M50 48v40" stroke="#0a1b4d" stroke-width="5" fill="none" stroke-linejoin="round"/>',
};
const glyph = q => `<svg class="glyph" viewBox="0 0 100 100">${GLYPH[q.cat]}</svg>`;

function card(q, i, big) {
  const r = RAR[rarity(q)];
  const c = el("div", { class: "card" + (big ? " feat2" : ""), "data-c": q.code, style: `--r1:${r.r1};--r2:${r.r2};--r3:${r.r3};--d:${1 + i * .05}s` });
  c.innerHTML = `<div class="bgpat"></div>${glyph(q)}<div class="shine"></div><div class="rbar"></div>`;
  c.append(el("div", { class: "code", text: q.code }), el("div", { class: "rar", text: r.label }),
    el("div", { class: "plate" }, el("div", { class: "nm", text: q.short }),
      el("div", { class: "meta" }, el("span", { text: q.engine }), el("span", { class: "price" }, el("i"), q.method.split(" ")[0]))));
  c.addEventListener("animationend", () => c.classList.add("ready"), { once: true });
  c.addEventListener("mouseenter", () => { F.Sound.tone(900 + Math.random() * 200, 0, .05, "triangle", .025); setSel(q); });
  c.addEventListener("click", () => openDetail(q));
  return c;
}

const FEAT = ["Q14", "Q07", "Q08"];
let filter = "todas", sel = F.byCode("Q14");
function renderShop() {
  const list = F.QUERIES.filter(q => filter === "todas" || q.cat === filter);
  const feat = filter === "todas" ? FEAT.map(F.byCode) : list.slice(0, Math.min(2, list.length));
  const daily = list.filter(q => !feat.includes(q));
  $("feat").replaceChildren(...feat.map((q, i) => card(q, i, true)));
  $("daily").replaceChildren(...daily.map((q, i) => card(q, i + feat.length)));
  [...document.querySelectorAll(".card")].forEach(c => c.classList.toggle("sel", c.dataset.c === sel.code));
}
const TABS = [["todas", "Tienda"], ...Object.entries(F.CATS).map(([k, c]) => [k, c.label])];
$("tabs").replaceChildren(...TABS.map(([k, l]) => el("button", { class: k === "todas" ? "on" : null, "data-k": k, text: l, onclick: () => {
  filter = k;
  [...$("tabs").children].forEach(b => b.classList.toggle("on", b.dataset.k === k));
  F.Sound.noise(0, .12, .06, 2500);
  renderShop();
} })));

function setSel(q) {
  sel = q;
  $("mode").replaceChildren("Modo: ", el("b", { text: `${q.code} · ${q.short}` }));
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", c.dataset.c === q.code));
}
$("play").onclick = () => { F.Sound.tone(220, 0, .2, "square", .04, 440); openDetail(sel); };

function openDetail(q) {
  setSel(q);
  const r = RAR[rarity(q)];
  const big = card(q, 0);
  big.classList.add("ready");
  $("dl").replaceChildren($("back"), big);
  $("rtag").textContent = `${r.label} · ${F.CATS[q.cat].label}`;
  $("rtag").style.setProperty("--r1", r.r1);
  const panel = F.createPanel(q, {
    text: { run: "¡Consultar!", runMutation: "¡Lanzar!", loading: "Cayendo en la zona", empty: "No hay nada en la zona", fill: "Completá tu equipamiento y lanzá", invalid: "Falta equipamiento" },
    autorunDelay: 350,
    onSuccess: (q, req, res, msg) => { if (msg) { banner(q.code === "Q13" && req.method === "DELETE" ? "¡Baja aplicada!" : "¡Venta épica!", msg); refresh(); } else F.Sound.tone(1200, 0, .08, "triangle", .03); },
    onError: e => banner("¡Eliminado!", e.message.split("\n")[0], true),
  });
  $("dbox").replaceChildren(panel.root);
  $("detail").classList.add("on");
  $("detail").setAttribute("aria-hidden", "false");
  F.Sound.noise(0, .3, .08, 900); F.Sound.tone(330, 0, .25, "sine", .05, 660);
  if (q.mutation) setTimeout(() => panel.focus(), 400);
}
function closeDetail() {
  if (!$("detail").classList.contains("on")) return;
  $("detail").classList.remove("on");
  $("detail").setAttribute("aria-hidden", "true");
  F.Sound.noise(0, .2, .05, 1500);
}
$("back").onclick = closeDetail;
addEventListener("keydown", e => {
  if (e.key === "Escape") { closeDetail(); return; }
  if (["INPUT", "SELECT"].includes(document.activeElement?.tagName)) return;
  if (e.key === "Enter" && !$("detail").classList.contains("on") && $("app").classList.contains("on")) openDetail(sel);
});

const cf = $("confetti"), cfx = cf.getContext("2d");
let bits = [];
function sizeCf() { cf.width = innerWidth; cf.height = innerHeight; }
sizeCf(); addEventListener("resize", sizeCf);
function confetti() {
  const cols = ["#ffe94a", "#59ff9a", "#2fa8ff", "#ff5f6d", "#cf7bff", "#ffffff"];
  for (let i = 0; i < 180; i++) bits.push({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .38, vx: (Math.random() - .5) * 18, vy: -6 - Math.random() * 14, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, life: 1 });
  if (bits.length === 180) requestAnimationFrame(tick);
}
function tick() {
  cfx.clearRect(0, 0, cf.width, cf.height);
  for (const b of bits) {
    b.vy += .38; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= .006;
    cfx.save(); cfx.translate(b.x, b.y); cfx.rotate(b.r); cfx.globalAlpha = Math.max(0, b.life);
    cfx.fillStyle = b.c; cfx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2))); cfx.restore();
  }
  bits = bits.filter(b => b.life > 0 && b.y < cf.height + 40);
  if (bits.length) requestAnimationFrame(tick); else cfx.clearRect(0, 0, cf.width, cf.height);
}
let banT;
function banner(t, s, bad) {
  const b = $("ban");
  $("bant").textContent = t;
  $("bans").textContent = s;
  b.classList.toggle("bad", !!bad);
  b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
  if (bad) { F.Sound.tone(300, 0, .5, "sawtooth", .05, 80); F.Sound.noise(0, .4, .08, 400); }
  else { confetti(); [523, 659, 784, 1047, 1319].forEach((f, i) => F.Sound.tone(f, i * .09, .5, "square", .035)); F.Sound.noise(.1, .5, .04, 6000); }
  clearTimeout(banT);
  banT = setTimeout(() => b.classList.remove("on"), 2900);
}

for (let i = 0; i < 7; i++) {
  const w = 120 + Math.random() * 200;
  const c = el("div", { class: "cloud", style: `width:${w}px;height:${w * .32}px;top:${4 + Math.random() * 48}%;animation-duration:${60 + Math.random() * 80}s;animation-delay:-${Math.random() * 120}s;opacity:${.55 + Math.random() * .35}` });
  $("clouds").append(c);
}

function timer() {
  const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0);
  const s = Math.floor((m - n) / 1000), p = x => String(x).padStart(2, "0");
  $("timer").textContent = `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
}
timer(); setInterval(timer, 1000);

async function refresh() {
  const s = await F.snapshot();
  $("kp").textContent = s.productos.length;
  $("kl").textContent = s.lotes.length;
  $("ki").textContent = FMT.pesos(s.totalIngresos);
  $("st").classList.toggle("bad", !s.online);
  $("st").querySelector("span").textContent = s.online ? "API en línea · listo" : "API sin conexión";
  return s;
}

const TIPS = [
  "Q15 consume primero los lotes que vencen antes. Así funciona FEFO.",
  "Si falla el registro en MongoDB, la saga de Q14 devuelve las unidades a Redis.",
  "Redis resuelve la concurrencia del stock con WATCH, MULTI y EXEC.",
  "MongoDB corre como replica set rs0 para poder usar transacciones.",
  "La baja de clientes es lógica: el cliente queda con activo en falso.",
];
async function boot() {
  const q = F.byCode("Q14");
  $("lcard").innerHTML = `${glyph(q).replace('class="glyph"', "")}<div class="lname">Registrar venta</div>`;
  $("tip").textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
  const bar = $("lbar");
  for (let i = 0; i < 20; i++) bar.append(el("i"));
  let pct = 0;
  const snapP = refresh();
  const set = p => { pct = p; [...bar.children].forEach((x, i) => x.classList.toggle("on", i < Math.round(p / 5))); $("lpct").textContent = `CARGANDO ${Math.round(p)}%`; };
  await new Promise(res => {
    const iv = setInterval(() => { set(Math.min(90, pct + 4 + Math.random() * 8)); if (pct >= 90) { clearInterval(iv); res(); } }, 110);
  });
  await snapP;
  set(100);
  await new Promise(r => setTimeout(r, 400));
  renderShop();
  setSel(sel);
  $("load").classList.add("done");
  $("app").classList.add("on");
  F.Sound.noise(0, .6, .07, 700); F.Sound.tone(196, .1, .5, "square", .03, 392);
}

$("docs").href = F.API.base + "/docs";
const paintMute = () => ($("mute").textContent = F.Sound.muted ? "Sonido: no" : "Sonido: sí");
paintMute();
$("mute").onclick = () => { F.Sound.toggle(); paintMute(); };
$("themes").append(F.themeSwitcher("farmanite", "sbtn"));
setInterval(refresh, 30000);
boot();
})();
</script>
</body>
</html>
