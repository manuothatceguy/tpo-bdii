services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.14
    command: sleep infinity
    volumes:
      - ..:/workspaces/tpo-bdii:cached
    environment:
      UV_PROJECT_ENVIRONMENT: /home/vscode/.venvs/server
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  api:
    image: mcr.microsoft.com/devcontainers/python:3.14
    user: vscode
    network_mode: service:app
    working_dir: /workspaces/tpo-bdii
    command: sh -c "python -m pip install uv && python -m uv run --frozen --directory server fastapi dev main.py"
    restart: unless-stopped
    volumes:
      - ..:/workspaces/tpo-bdii:cached
    environment:
      UV_PROJECT_ENVIRONMENT: /home/vscode/.venvs/server
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379

  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
